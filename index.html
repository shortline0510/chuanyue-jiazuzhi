/* ---------- 奏摺 ---------- */
function buildMemo() {
  const E = G.emp, n = E.nat;
  const types = MEMORIAL_TYPES.filter(t => {
    if (t.impeach) return E.ministers.length >= 3;
    return t.offices.some(o => officeOf(o));
  });
  if (!types.length) return null;
  const t = wpick(types, x => ({ m_disaster:n.minxin < 50 ? 16 : 10, m_military:n.border > 50 ? 16 : 9, m_impeach:12, m_funding:8, m_omen:6, m_tax:E.treasury < 0 ? 16 : 5, m_peace:7, m_remonstrate:Math.max(1, 9 - E.record.killedLoyal * 3 - E.record.ignoredRemonstrance) }[x.id] || 8));
  const m = t.offices.map(officeOf).find(Boolean) || pick(E.ministers);
  const memo = { tid:t.id, mid:m.id, mname:m.name, moffice:m.office, province:pick(PROVINCES), truth:memoTruth(t, m) };
  if (t.impeach) {
    const rivals = E.ministers.filter(x => x !== m && x.faction !== m.faction);
    const tg = rivals.length ? wpick(rivals, x => 10 + x.ambition / 5) : pick(E.ministers.filter(x => x !== m));
    memo.targetId = tg.id; memo.tname = tg.name; memo.toffice = tg.office;
    // 被彈劾者真的有問題嗎？品德低就多半屬實
    if (memo.truth === 'true' && tg.virtue >= 70 && Math.random() < 0.6) memo.truth = 'exaggerate';
  }
  memo.trueAsk = Math.round(t.ask * rand(0.8, 1.3));
  memo.ask = Math.round(memo.trueAsk * (memo.truth === 'exaggerate' ? 1.6 : memo.truth === 'conceal' ? 0.35 : memo.truth === 'fabricate' ? 1.2 : 1));
  return memo;
}
function memoTruth(t, m) {
  if (!t.lies.length) return 'true';
  const E = G.emp;
  let h = MEMORIAL_HONESTY_BASE + (m.loyalty + m.virtue) / 400 + E.mods.honesty - E.record.killedLoyal * 0.04;
  if (E.flags.honestYear && E.flags.honestYear >= G.year - 1) h += 0.3;
  if (E.nat.huangquan > MEMORIAL_HIGH_POWER) h -= 0.2;
  if (Math.random() < clamp(h, 0.1, 0.92)) return 'true';
  if (E.nat.huangquan > MEMORIAL_HIGH_POWER && t.lies.includes('conceal')) return 'conceal';

}

function memoText(memo, s) {

}
// 查證：錦衣衛必中，代價是銀兩、皇權與宦官坐大

}
// action: approve／reject／hold；informed：已查明真相（誇大與隱瞞會改按實情處理）
function resolveMemo(memo, action) {
  const t = MEMORIAL_TYPES.find(x => x.id === memo.tid), out = [], tBefore = G.emp.treasury;
  const truth = memo.truth, informed = memo.revealed;

  else if (action === 'hold') { const r = (t.out[truth] || t.out.true).reject; res = { text:'陛下將奏摺留中不發。' + r.text, nat:{}, chain:r.chain && Math.random() < 0.5 ? r.chain : null }; for (const k in r.nat || {}) res.nat[k] = Math.round(r.nat[k] / 2); }
  else res = (t.out[truth] || t.out.true)[action];

  const ctx = { actor:{ kind:'minister', ref:memo.mid }, target:memo.targetId ? { kind:'minister', ref:memo.targetId } : null, memo };
  const text = applyEmpResult(res, ctx, out);

// 日後揭發：當初誤信的謊報東窗事發

/* ---------- 朝政事件 ---------- */
function needOK(k) {
  const E = G.emp;
  if (k.startsWith('minister:')) return minsOf(k.slice(9)).length > 0;
  switch (k) {
    case 'heir': return !!heirP();
    case 'noHeir': return !heirP();
    case 'heirOld': { const h = heirP(); return !!h && ageOf(h) >= 25 && (h.amb || 0) >= 60 && ageOf(head()) >= 45; }
    case 'consort': return consorts().length >= 1;
    case 'consort2': return consorts().length >= 2 && !!queenP();
    case 'queen': return !!queenP();
    case 'princeAdult': return adultSons().filter(s => s.id !== G.heirId).length >= 1;
    case 'princes2': return adultSons().length >= 2;
    case 'princess': return princesses().length >= 1;
    case 'branch': return E.branches.length >= 1;
    case 'noble': return E.zongshi.nobles.length >= 1;
    case 'motherAlive': return !!empMother();
    case 'newborn': return !!(E.lastBirth && monthIndex() - E.lastBirth.at <= 3 && P(E.lastBirth.motherId));
    case 'clanTalent': { const t = clanTop(1)[0]; return !!t && clanScore(t) >= 45; }
    case 'noHeirKid': return !heirP() && !empKids().length;
  }
  return true;
}
function empEventOK(ev, ignoreSeen) {
  if (ev.chain || ev.incognito) return false;
  const c = ev.cond || {}, E = G.emp;
  if (ev.once && G.seen[ev.id] !== undefined) return false;
  if (!ignoreSeen && G.seen[ev.id] !== undefined && monthIndex() - G.seen[ev.id] < 36) return false;
  if (c.nat) for (const k in c.nat) if (E.nat[k] < c.nat[k][0] || E.nat[k] > c.nat[k][1]) return false;
  if (c.needs && !c.needs.every(needOK)) return false;
  if (c.reign && reignYears() < c.reign) return false;
  if (ev.founderOnly && E.emperors.length > 3) return false;
  return true;
}
function pickEmpEvent() {
  const E = G.emp, list = EMP_EVENTS.filter(ev => empEventOK(ev));
  if (!list.length) return null;
  return wpick(list, ev => (ev.weight || 10) * (ev.flood ? E.mods.flood : 1) * (ev.plague ? E.mods.plague : 1) * (ev.id === 'ev_remonstrate' ? Math.max(0.2, 1 - E.record.killedLoyal * 0.3) : 1));
}
function resolveActor(spec) {
  if (!spec) return null;
  const E = G.emp;
  if (spec === 'minister') { const m = pick(E.ministers); return m && { kind:'minister', ref:m.id }; }
  if (spec.startsWith('minister:')) { const ms = minsOf(spec.slice(9)).sort((a, b) => b.ambition - a.ambition); return ms[0] && { kind:'minister', ref:ms[0].id }; }
  const per = p => p && { kind:'person', ref:p.id };
  switch (spec) {
    case 'consort': { const cs = consorts().filter(c => c.consort.rank > 0); return per(cs.length ? cs.sort((a, b) => b.consort.favor - a.consort.favor)[0] : consorts()[0]); }
    case 'queen': return per(queenP());
    case 'prince': { const ss = adultSons().filter(s => s.id !== G.heirId); return per(ss.sort((a, b) => (b.amb || 0) - (a.amb || 0))[0]); }
    case 'heir': return per(heirP());
    case 'princess': return per(pick(princesses()));
    case 'mother': return per(empMother());
    case 'newborn': return per(E.lastBirth && P(E.lastBirth.motherId));
    case 'clanTalent': return per(clanTop(1)[0]);
    case 'branch': { const b = [...E.branches].sort((a, b) => b.power - a.power)[0]; return b && { kind:'branch', ref:b.id }; }
    case 'noble': { const i = randi(0, E.zongshi.nobles.length - 1); return E.zongshi.nobles[i] && { kind:'noble', ref:i }; }
  }
  return null;
}
function actorObj(a) {
  if (!a) return null;
  if (a.kind === 'minister') return minById(a.ref);
  if (a.kind === 'person') { const p = P(a.ref); return p && p.alive ? p : null; }
  if (a.kind === 'branch') return branchOf(a.ref);
  if (a.kind === 'noble') return G.emp.zongshi.nobles[a.ref];
  return null;
}
const actorValid = a => !!actorObj(a);
function actorName(a) {
  const o = actorObj(a); if (!o) return '';
  if (a.kind === 'minister') return o.name;
  if (a.kind === 'person') return (empTitle(o) ? empTitle(o).replace(G.emp.dynasty, '') : '') + o.name;
  if (a.kind === 'branch') return o.title;
  if (a.kind === 'noble') return o.title + o.name;
  return '';
}
function queueEmpEvent(ev, actor) {
  if (!ev) return;
  enqueue({ type:'eev', id:ev.id, actor:actor || resolveActor(ev.actor) });
}
function tplE(s, ctx) {
  const a = ctx.actor, o = actorObj(a);
  return s.replace(/\{emperor\}/g, head().name).replace(/\{dynasty\}/g, G.emp.dynasty).replace(/\{actor\}/g, actorName(a) || '某人')
    .replace(/\{office\}/g, o && o.office ? o.office : '').replace(/\{province\}/g, ctx.province || (ctx.province = pick(PROVINCES)));
}
const empOptCost = o => o.cost ? empWan(o.cost) : 0;
const empOptOK = o => (!o.cost || G.emp.treasury >= empOptCost(o) * 0.999 || o.cost <= 0) && (!o.purse || G.silver >= empWan(o.purse));
function resolveEmpEvent(ev, oi, ctx) {
  const o = ev.options[oi], out = [], tBefore = G.emp.treasury;
  if (o.cost) spendTreasury(o.cost, out);
  if (o.purse) { G.silver -= empWan(o.purse); out.push({ t:'內帑', v:-1 }); }
  let ok = true, res = o.win;
  if (o.check) { ok = Math.random() * 100 < empChance(o.check); res = ok ? o.win : (o.lose || { text:'事與願違。' }); }
  if (ctx.policy) res = Object.assign({}, res);   // 國策阻力事件
  const text = applyEmpResult(res, ctx, out);
  G.seen[ev.id] = monthIndex();
  // 危機鏈：沒有升級也沒有平息的結果，一律視為平息
  if (ctx.chainId && G.emp.crises[ctx.chainId]) { const c = G.emp.crises[ctx.chainId]; c.queued = false; if (!res.chain && !res.chainEnd) delete G.emp.crises[ctx.chainId]; }
  empLog(`【${ev.title}】${text}`);

// 套用結果，回傳替換過代稱的文字
function applyEmpResult(res, ctx, out) {
  if (!res) return '';
  const E = G.emp, emp = head();
  const text = tplE(res.text || '', ctx).replace(/\{target\}/g, ctx.memo ? ctx.memo.tname || '' : '');
  applyNat(res.nat, out);
  if (res.treasury) addTreasury(res.treasury, out);
  if (res.purse) { G.silver += empWan(res.purse); }
  if (res.fx) { emp.delta = {}; applyFx(res.fx, emp, out); }
  if (res.mods) for (const k in res.mods) { if (['famine', 'plague', 'flood'].includes(k)) E.mods[k] *= res.mods[k]; else E.mods[k] = (E.mods[k] || 0) + res.mods[k]; }
  if (res.record) for (const k in res.record) E.record[k] = (E.record[k] || 0) + res.record[k];
  if (res.flag) E.flags[res.flag] = res.flag === 'honestYear' ? G.year : true;
  // 對事件主角的影響
  const a = ctx.actor, o = actorObj(a);
  if (res.actor && o) {
    if (a.kind === 'minister') adjustMinister(o, res.actor, out);
    else if (a.kind === 'branch') adjustBranch(o, res.actor, out);
    else if (a.kind === 'noble') { if (res.actor.remove && o.pid && P(o.pid)) P(o.pid).ztitle = '庶人'; if (res.actor.remove) { E.zongshi.nobles.splice(a.ref, 1); out.push({ t:`${o.title}${o.name}${res.actor.remove}`, v:-1 }); } }
    else if (a.kind === 'person') {
      const fx = {}; for (const k of STATS) if (res.actor[k]) fx[k] = res.actor[k];
      if (Object.keys(fx).length) { o.delta = {}; applyFx(fx, o, out); }
      if (res.actor.ambition) { o.amb = clamp((o.amb || 40) + res.actor.ambition, 0, 100); out.push({ t:`${o.name}野心`, v:res.actor.ambition }); }
      if (res.actor.loyalty) o.loy = clamp((o.loy || 60) + res.actor.loyalty, 0, 100);
      if (res.actor.favor && o.consort) { o.consort.favor = clamp(o.consort.favor + res.actor.favor, 0, 100); out.push({ t:`${o.name}寵愛`, v:res.actor.favor }); }
      if (res.actor.demote && o.consort) { setConsortRank(o, 3); o.consort.favor = 5; out.push({ t:`${o.name}被廢入冷宮`, v:-1 }); }
      if (res.actor.heqin) { o.out = 'heqin'; LIVE = null; plog(o, `${G.year}年 遠嫁塞外和親`); out.push({ t:`${o.name}遠嫁和親`, v:-1 }); }
    }
  }
  if (res.target && ctx.target) { const tg = actorObj(ctx.target); if (tg) adjustMinister(tg, res.target, out); }
  // 儲位

  if (res.chainEnd && ctx.chainId) delete E.crises[ctx.chainId];
  if (res.chain) {
    if (ctx.chainId === res.chain && E.crises[res.chain]) {
      const c = E.crises[res.chain], ch = CRISIS_CHAINS[res.chain];
      c.stage++; c.queued = false;

    } else if (!E.crises[res.chain]) {

    }

  if (res.openEdict) E._open = 'edict';
  if (res.reveal) ctx.reveal = true;
  if (res.end) E._end = { type:res.end, swap:res.swapBranch && a && a.kind === 'branch' ? a.ref : null };

  return text;
}
// 國策阻力事件（動態生成）

/* ---------- 國策 ---------- */
function policyBlock(pol) {
  const E = G.emp;
  if (E.policiesDone.includes(pol.id)) return '已完成';
  if (E.policies.some(x => x.id === pol.id)) return '推動中';
  if (E.policies.length >= EMP_POLICY_SLOTS) return `同時最多推動 ${EMP_POLICY_SLOTS} 項`;
  if (E.treasury < empWan(pol.start)) return '國庫不足';

}

  const E = G.emp;

  E.policies.push({ id:pol.id, prog:0, since:G.year });
  for (const f of pol.support) for (const m of minsOf(f)) m.loyalty = clamp(m.loyalty + 5, 0, 100);
  for (const f of pol.oppose) for (const m of minsOf(f)) m.loyalty = clamp(m.loyalty - 6, 0, 100);

function cancelPolicy(id) { const pol = POLICIES2.find(x => x.id === id); G.emp.policies = G.emp.policies.filter(x => x.id !== id); applyNat({ huangquan:-3 }); empLog(`中止國策「${pol.name}」`); save(); }
function policyYear() {
  const E = G.emp;
  for (const a of [...E.policies]) {
    const pol = POLICIES2.find(x => x.id === a.id); if (!pol) continue;
    a.prog++;
    if (a.prog >= pol.years) { completePolicy(pol); continue; }
    if (Math.random() < EMP_POLICY_RESIST_RATE) enqueue({ type:'eev', dyn:policyResistEvent(pol), policy:pol.id, actor:null });
  }
}
function completePolicy(pol) {
  const E = G.emp, out = [];
  E.policies = E.policies.filter(x => x.id !== pol.id);
  E.policiesDone.push(pol.id); E.record.policies++;
  applyNat(pol.done.nat, out);
  for (const k in pol.done.mods) { if (['famine', 'plague', 'flood'].includes(k)) E.mods[k] *= pol.done.mods[k]; else E.mods[k] = (E.mods[k] || 0) + pol.done.mods[k]; }
  let extra = '';
  if (pol.done.cutFief) {

    E.zongshi.extra = Math.round((E.zongshi.extra || 0) * 0.6); syncZong();
    const strong = [...E.branches].sort((a, b) => b.power - a.power)[0];
    if (strong && Math.random() < pol.rebelRisk && !E.crises.fief) { E.crises.fief = { stage:1, at:monthIndex() + randi(3, 8), actor:{ kind:'branch', ref:strong.id } }; extra = `${strong.title}對削藩極為不滿……`; }
    else E.flags.cutFiefDone = true;
  }
  empLog(`國策「${pol.name}」大功告成！`);
  enqueue({ type:'info', title:'國策完成', lines:[`「${pol.name}」歷時 ${pol.years} 年，大功告成！`, pol.desc, ...out.filter(o => o.nat).map(o => `${NAT_NAME2[o.nat]} ${o.v > 0 ? '+' : ''}${o.v}`), extra].filter(Boolean) });
}

// 結束一位皇帝的統治：計算廟號、諡號與史官評語
function reignReport(ending) {
  const E = G.emp, r = E.record, n = E.nat, cur = E.emperors[E.emperors.length - 1];
  const rep = { index:E.emperors.length - 1, reign:G.year - E.reignStart, ending, wins:r.wins, losses:r.losses, policies:r.policies, killed:r.killedLoyal, wrongful:r.wrongful,
    ignored:r.ignoredRemonstrance, minxin:n.minxin, lizhi:n.lizhi, huanguan:n.huanguan, waiqi:n.waiqi, border:n.border, treasury:E.treasury, reliefs:r.reliefs };
  // 評分：國勢加權平均 ×0.8，再加減功過（約 40–80 分為常態）
  rep.score = Math.round(clamp((n.minxin * 0.3 + n.lizhi * 0.2 + n.tianming * 0.2 + n.bingli * 0.15 + (100 - n.border) * 0.15) * 0.8
    + Math.min(r.wins, 5) * 2 - r.losses * 4 + Math.min(r.policies, 4) * 3 + Math.min(r.reliefs, 10) * 0.5 - r.killedLoyal * 5 - r.wrongful * 3 - r.ignoredRemonstrance * 1.5 + (E.treasury > 0 ? 3 : -6)
    + Math.min(rep.reign, 30) / 5 + (ending === 'revival' ? 15 : ending === 'fall' ? -25 : ending === 'deposed' || ending === 'captured' ? -10 : 0), 0, 100));
  const used = new Set(E.emperors.map(x => x.temple).filter(Boolean));
  rep.temple = (TEMPLE_RULES.find(t => !used.has(t.name) && t.test(E, rep)) || { name:'穆宗' }).name;
  if (used.has(rep.temple)) rep.temple = pick(['睿宗', '順宗', '昭宗', '欽宗', '德宗', '敬宗']);
  rep.posthumous = POSTHUMOUS_RULES.find(t => t.test(rep)).name;
  const pro = HISTORIAN_PROS.find(t => t.test(rep)).text, con = HISTORIAN_CONS.find(t => t.test(rep)).text;
  rep.comment = `${rep.temple}・${rep.posthumous}：${pro}${con ? '，' + con : ''}。`;
  if (['文皇帝', '武皇帝', '明皇帝', '高皇帝'].includes(rep.posthumous) && rep.score >= 70) E.flags.wise = true;
  if (ending === 'revival' || E.flags.revival) rep.ending = ending === 'natural' ? 'revival' : ending;
  Object.assign(cur, { to:G.year, temple:rep.temple, posthumous:rep.posthumous, comment:rep.comment, ending:rep.ending, score:rep.score, reign:rep.reign,
    wins:r.wins, losses:r.losses, policies:r.policies, kids:empKids(true).length, fiefs:E.branches.length });
  return rep;
}
// 非駕崩的退場（被廢、北狩、禪讓、亡國）
function endReign(kind, swap, chosen) {
  const E = G.emp, emp = head();

  if (kind === 'killed') { E.pendingEnding = 'killed'; die(emp, '死於宮廷政變'); return; }
  if (kind === 'fall') { E.fallRep = reignReport('fall'); emp.alive = false; emp.dy = G.year; emp.deathCause = '城破殉國'; LIVE = null; enqueue({ type:'efall', reason:'叛軍攻破京城，王朝覆滅' }); return; }

// 繼位候選人：在京的皇室血親（先帝子女優先，男性優先）
function succCandidates(oldId) {
  const old = P(oldId);
  const kidSet = new Set(old ? old.children : []);
  return livingMembers().filter(p => p.blood && p.id !== oldId && !p.consort && !p.out)
    .sort((a, b) => kidSet.has(b.id) - kidSet.has(a.id) || (b.gender === 'm') - (a.gender === 'm') || ageOf(b) - ageOf(a));
}
// 奪嫡：選定的皇子能否壓住其他有野心的兄弟
function resolveContest(chosen, oldId) {
  const rivals = succCandidates(oldId).filter(p => p !== chosen && p.gender === 'm' && ageOf(p) >= 16 && (p.amb || 0) >= 55);
  for (const r of rivals.sort((a, b) => (b.amb || 0) - (a.amb || 0))) {
    const backer = r.backer && minById(r.backer);
    const chance = 15 + ((r.amb || 0) - 55) * 0.8 + (backer ? backer.ambition / 5 : 0) - (eff(chosen, 'eq') - 50) / 3;
    if (Math.random() * 100 < chance) return { winner:r, text:`${r.name}${backer ? '勾結' + backer.office + backer.name + '，' : ''}率兵包圍宮城，矯詔自立！${chosen.name}被軟禁於宮中。` };
  }
  return { winner:chosen, text:rivals.length ? `${rivals.map(r => r.name).join('、')}心有不甘，終究沒敢動手。` : '諸皇子俯首稱臣，新君順利即位。' };
}

// 重新整理主脈：新君一系留在京師逐人模擬，其餘按「先帝之子」收成各王一脈
function foldLines(emp, old) {
  const E = G.emp, keep = new Set([emp.id]);
  const sp = spouseOf(emp); if (sp) keep.add(sp.id);
  for (const id of descendants(emp)) { keep.add(id); const c = P(id); const cs = c && spouseOf(c); if (cs) keep.add(cs.id); }
  for (const pid of [emp.fatherId, emp.motherId]) if (pid) keep.add(pid);
  for (const id of E.consorts) keep.add(id);
  for (const id of keep) { const k = P(id); if (k && k.out === 'zongshi') k.out = null; }   // 宗族出身的新君：一家入京
  for (const p of alivePeople()) if (p.consort && p.consort.dowager && !p.out) keep.add(p.id);
  const empIds = new Set(E.emperors.map(x => x.id));
  const fromOld = old && descendants(old).has(emp.id);
  // 新君的未婚姊妹留在宮中（日後指婚出降）
  const sibs = old ? old.children.map(P).filter(c => c && c.alive && c.gender === 'f' && !isMarried(c) && !c.out && fromOld) : [];
  for (const s of sibs) keep.add(s.id);
  const groups = new Map(), lines = [];
  const rootOf = p => { let cur = p; for (let i = 0; i < 20 && cur; i++) { const par = [cur.fatherId, cur.motherId].map(P).find(x => x && x.blood); if (!par) return null; if (empIds.has(par.id)) return cur; cur = par; } return null; };
  const oldLine = [];
  for (const p of alivePeople()) {
    if (keep.has(p.id) || p.out) continue;
    let who = p;
    if (!p.blood) { const pt = spouseOf(p); if (pt && pt.blood) who = pt; }
    if (!fromOld && old && (who.id === old.id || descendants(old).has(who.id))) { oldLine.push(p); continue; }
    const r = rootOf(who);
    if (r && r.gender === 'm') { if (!groups.has(r.id)) groups.set(r.id, []); groups.get(r.id).push(p); }
    else if (r && r.gender === 'f' && isMarried(r)) { p.out = 'wed'; }
    else { p.out = 'zongshi'; p.ztitle = p.ztitle || '宗室'; }
  }
  for (const [rid, ms] of groups) {
    const r = P(rid), t = nextTitle();
    E.zongshi.titles.push(t);
    for (const x of ms) { x.out = 'zongshi'; if (!x.ztitle || x.ztitle === '宗室') x.ztitle = x.id === rid ? t : x.blood ? t.replace(/王$/, '') + '王府宗親' : (x.gender === 'f' ? '王妃' : '儀賓'); x.liye = x.liye || ageOf(x) >= JOB_MIN_AGE; }
    lines.push(`${r.name}${r.alive ? '受封' : '一脈追封'}${t}，一家 ${ms.length} 人歸入宗族`);
  }
  if (oldLine.length) {
    const headP = oldLine.filter(x => x.blood).sort((a, b) => ageOf(b) - ageOf(a))[0] || oldLine[0];
    const last = E.emperors[E.emperors.length - 2];
    const b = makeBranch(oldLine, headP, { title:(last && last.temple ? last.temple : '前朝') + '一脈', kind:'old', power:-10, loyalty:-20 });
    lines.push(`前朝主脈 ${oldLine.length} 人收為「${b.title}」，遷居${b.land}`);
  }
  LIVE = null; syncZong();
  return lines;
}

const clanAlive = () => Object.values(G.people).filter(p => p.alive && p.out === 'zongshi');
function syncZong() { const z = G.emp.zongshi; z.extra = Math.max(0, Math.round(z.extra || 0)); z.count = clanAlive().length + z.extra; return z.count; }
const clanJobName = p => p.job ? (p.job === 'official' ? offName(p.rank) : JOB_LINES[p.job].ranks[p.rank]) : (p.lastJob ? '致仕' : '');
// 才德分數：用來挑選讓賢人選、宗室賢才
const clanScore = p => Math.round((eff(p, 'int') + eff(p, 'eq')) * 0.4 + eff(p, 'str') * 0.2 + (p.job === 'official' ? p.rank * 2 : p.job && isTop(p) ? 10 : 0));
// 繼位人選分數：才德為主，但年紀越大越扣分（35 歲以上），10 歲以下不考慮
const heirScore = p => { const a = ageOf(p); return clanScore(p) - Math.max(0, a - 35) * HEIR_AGE_PENALTY - (a < 16 ? 12 : 0); };
function clanHeirs(n) { return clanAlive().filter(p => p.blood && ageOf(p) >= 10 && ageOf(p) <= 60).sort((a, b) => heirScore(b) - heirScore(a)).slice(0, n); }
function clanTop(n, minAge = 18) { return clanAlive().filter(p => p.blood && ageOf(p) >= minAge && ageOf(p) <= 65).sort((a, b) => clanScore(b) - clanScore(a)).slice(0, n); }
// 依父母（一方）的行業決定出路：父母任官或讀書 → 讀書考科舉；否則多半承襲家業
function inheritJob(p) {

  if (pj.some(j => j === 'official' || j === 'student')) return 'student';

function clanBear(f, m) {

  const avg = k => (f.stats[k] + m.stats[k]) / 2;
  const score = (avg('int') + avg('eq') + avg('str')) / 3 * 0.6 + rand(0, 45);
  const stats = {}; for (const k of STATS) stats[k] = k === 'hp' ? randi(70, 92) : k === 'mood' ? randi(55, 75) : clamp(Math.round(randi(4, 12) + avg(k) * 0.12), 1, 35);
  const c = makePerson({ name:G.surname + randomGiven(g), gender:g, by:G.year, stats, apt:score < 35 ? 0 : score < 52 ? 1 : score < 66 ? 2 : 3, gen:blood.gen + 1, fatherId:f.id, motherId:m.id });
  c.out = 'zongshi'; c.ztitle = '宗室'; c.talent = pick(ZHUAZHOU_ITEMS).id;
  f.children.push(c.id); m.children.push(c.id);
  plog(c, `${G.year}年 出生於宗室`); plog(blood, `${G.year}年 喜得${g === 'm' ? '一子' : '一女'}${c.name}`);
  return c;
}
function clanYear() {

    const a = ageOf(p), cap = capOf(p);

    if (a <= 20) {
      const g = { int:randi(0, 2), eq:randi(0, 2), str:randi(0, 2) };
      const tl = talentOf(p); if (tl) for (const k in tl.grow) if (k in g) g[k] += tl.grow[k];
      const ed = EDUCATIONS.find(x => x.id === p.edu); if (ed && a >= QIMENG_AGE && a <= 18) for (const k in ed.grow) if (k in g) g[k] += ed.grow[k];
      for (const k in g) p.stats[k] = clamp(p.stats[k] + g[k], 0, Math.max(cap, p.stats[k]));
    }
    if (a < 40) p.stats.hp = Math.min(100, p.stats.hp + 2); else p.stats.hp = Math.max(0, p.stats.hp - (1 + (a - 40) * 0.12));
    if (p.stats.hp <= 0 || a >= p.life) { clanDie(p, a < 50 ? '病逝' : '壽終正寢'); continue; }
    // 6 歲啟蒙、16 歲立業：照父母的行業走
    if (a === QIMENG_AGE && !p.edu) { p.edu = inheritEdu(p); plog(p, `${G.year}年 六歲啟蒙：${EDUCATIONS.find(x => x.id === p.edu).name}`); }
    if (a >= JOB_MIN_AGE && a < CLAN_RETIRE_AGE && !p.job && !p.lastJob && !p.liye) {
      p.liye = true; const j = p.plannedJob || inheritJob(p);
      p.job = j; p.rank = 0; p.prof = 0;
      plog(p, `${G.year}年 ${j === 'student' ? '承家學，閉門讀書準備科舉' : '進入' + JOB_LINES[j].place + '當' + JOB_LINES[j].ranks[0]}`);
    }
    // 婚嫁與生育
    if (p.blood && a >= 17 && a <= 35 && !p.spouseId && Math.random() < CLAN_MARRY_RATE) {
      // 女兒出嫁：嫁到別家，從此不算宗族（子女隨夫家）；兒子娶妻，妻兒入宗族
      if (p.gender === 'f') { p.out = 'wed'; p.ztitle = '已出嫁'; plog(p, `${G.year}年 出嫁`); simN--; continue; }
      const g = p.gender === 'm' ? 'f' : 'm';
      const s = makePerson({ name:randomFullName(g, G.surname), gender:g, by:G.year - randi(Math.max(16, a - 5), a + 2), stats:randStats(45, 12), blood:false, gen:p.gen, apt:1 });
      s.out = 'zongshi'; s.ztitle = g === 'f' ? '宗婦' : '儀賓'; s.talent = 'coin'; s.liye = true;
      p.spouseId = s.id; s.spouseId = p.id; plog(p, `${G.year}年 與${s.name}成親`); simN++;
    }
    const sp = spouseOf(p);

      const wife = p.gender === 'f' ? p : sp, wa = ageOf(wife);
      const crowd = Math.max(CLAN_CROWD_MIN, 1 - Math.pow(simN / CLAN_SIM_CAP, 2));
      const nk = p.children.length, rate = nk === 0 ? (wa <= 30 ? CLAN_FIRST_BIRTH : CLAN_BIRTH_RATE) : nk === 1 ? CLAN_BIRTH_RATE : CLAN_BIRTH_RATE * crowd;   // 頭兩胎不受擁擠影響
      if (wa >= 16 && wa <= 42 && Math.random() < rate) { clanBear(p.gender === 'm' ? p : sp, wife); simN++; }
    }
    // 行業：熟練度、升遷、科舉、考核、退休
    if (p.job && p.job !== 'student') {
      const L = jobLine(p);
      p.prof = Math.min(100, p.prof + (PROF_BASE + lineStatAvg(p) * PROF_STAT) * (p.job === 'official' ? OFFICIAL_PROF_MUL : 1));
      if (p.job !== 'official' && p.prof >= 100 && p.rank < L.ranks.length - 1) { p.rank++; p.prof = 0; plog(p, `${G.year}年 升任${L.ranks[p.rank]}`); }
      if (p.job === 'official' && assessYear) {
        const sc = (eff(p, 'int') + eff(p, 'eq')) / 2 + p.prof * ASSESS_PROF_W + rand(-12, 12) + CLAN_ASSESS_BONUS;
        const need = Math.min(ASSESS_CAP, ASSESS_PROMOTE + p.rank * ASSESS_STEP) + (p.rank >= TAIFU_RANK ? ASSESS_PREMIER_EXTRA : p.rank >= 12 ? ASSESS_TOP_EXTRA : 0);
        if (p.prof >= ASSESS_MIN_PROF && sc >= need && p.rank < L.ranks.length - 1) { p.rank++; p.prof = 0; plog(p, `${G.year}年 考核卓異，升任${offName(p.rank)}`); }
      }
      if (Math.random() < 0.5) { const k = L.stats[0]; p.stats[k] = clamp(p.stats[k] + 1, 0, Math.max(cap, p.stats[k])); }
    }
    if (p.job === 'student' && examYear && a >= 12) {
      while (p.job === 'student' && Math.random() < clamp(CLAN_EXAM_BASE + (eff(p, 'int') - 55) / 80, 0.05, 0.8)) {
        p.degree = (p.degree || 0) + 1;
        if (p.degree >= EXAMS.length) { p.job = 'official'; p.rank = CLAN_JINSHI_RANK; p.prof = 0; p.title = '進士'; plog(p, `${G.year}年 宗室子弟高中進士，授${offName(p.rank)}`); empLog(`宗室${p.name}高中進士`); }
        else { p.title = EXAMS[p.degree - 1].degree; plog(p, `${G.year}年 考中${p.title}`); }
      }
    }
    if (a >= CLAN_RETIRE_AGE && p.job && !E.ministers.some(m => m.pid === p.id)) { p.lastJob = p.job; plog(p, `${G.year}年 致仕還家`); p.job = null; }
    if (p.blood && a >= 18 && p.amb === undefined) p.amb = randi(15, 75);
    // 官至高位：吏部奏請拔擢入朝
    if (p.blood && !p.recommended && !E.ministers.some(m => m.pid === p.id) && ((p.job === 'official' && p.rank >= CLAN_MINISTER_RANK) || (p.job === 'army' && p.rank >= CLAN_ARMY_RANK))) { p.recommended = true; recs.push(p); }
  }
  // 宗族年輕一輩太少時，遠支宗親入京認祖歸宗，讓宗族不會斷代
  const young = clanAlive().filter(p => p.blood && ageOf(p) >= 14 && ageOf(p) <= 35).length;
  if (young < CLAN_MIN_YOUNG && simN < CLAN_SIM_CAP && Math.random() < CLAN_KIN_JOIN_RATE) {
    const g = Math.random() < 0.55 ? 'm' : 'f', emp = head();
    const k = makePerson({ name:G.surname + randomGiven(g), gender:g, by:G.year - randi(16, 24), stats:randStats(46, 12), apt:randi(1, 3), gen:emp ? emp.gen : 1, tag:'遠支宗親' });
    k.out = 'zongshi'; k.ztitle = '宗室'; k.talent = pick(ZHUAZHOU_ITEMS).id; k.edu = 'school';
    if (E.zongshi.extra > 0) E.zongshi.extra--;
    plog(k, `${G.year}年 自原籍入京，認祖歸宗`);
    empLog(`遠支宗親${k.name}入京認祖歸宗`);
  }
  for (const p of recs.slice(0, 1)) enqueue({ type:'eev', dyn:clanRecommendEvent(p), actor:{ kind:'person', ref:p.id } });
  for (const p of recs.slice(1)) p.recommended = false;   // 一年只奏一位，其餘明年再議
  // 具名宗親：由真實族人中選出最有本事、最有野心的三位
  E.zongshi.nobles = clanAlive().filter(p => p.blood && p.gender === 'm' && ageOf(p) >= 18).map(p => ({ pid:p.id, name:p.name, title:p.ztitle || '宗室', ability:clanScore(p), ambition:p.amb ?? 40 }))
    .sort((a, b) => (b.ability + b.ambition) - (a.ability + a.ambition)).slice(0, ZONGSHI_NOBLES_MAX);
  syncZong();
}
function settleFrozenClan() {

/* ---------- 畫面縮放：電腦上放大到視窗高度，手機全螢幕 ---------- */
// 判定是否為手機／平板：看瀏覽器識別字串，或「主要是觸控、沒有滑鼠」的裝置
function isMobileDevice() {
  if (/Android|iPhone|iPad|iPod|Mobile|HarmonyOS|Silk|Kindle/i.test(navigator.userAgent)) return true;
  return navigator.maxTouchPoints > 1 && matchMedia('(pointer: coarse)').matches && !matchMedia('(pointer: fine)').matches;
}
// 手機：直式全螢幕。電腦：填滿整個視窗（橫式），大螢幕時整體介面略為放大，維持易讀
function fitPhone() {
  const mobile = isMobileDevice();
  document.body.classList.toggle('mobile', mobile);
  document.body.classList.toggle('desktop', !mobile);
  const ph = $('phone');
  if (mobile) { PHONE_SCALE = 1; ph.style.width = ph.style.height = ''; }
  else {
    PHONE_SCALE = clamp(innerHeight / DESKTOP_BASE_HEIGHT, 1, DESKTOP_MAX_SCALE);
    ph.style.width = (innerWidth / PHONE_SCALE) + 'px';
    ph.style.height = (innerHeight / PHONE_SCALE) + 'px';
  }
  ph.style.setProperty('--s', PHONE_SCALE);
  if (G && !introOn && curView === 'family') applyView();
}

/* ---------- 彈窗系統 ---------- */
const MS = [];
const CBS = {}; let cbN = 0, curKeys = null;
function cb(fn) { const k = 'k' + (cbN++); CBS[k] = fn; if (curKeys) curKeys.push(k); return `RUN('${k}',event)`; }
function RUN(k, ev) { const f = CBS[k]; if (f) f(ev); }
// o = { kind:'ev'(屋簷事件)|'sc'(卷軸功能), title, ribbon, render(m), noClose, live, onClose }
function openModal(o) {
  const m = Object.assign({ keys:[], first:true, kind:'sc' }, o);
  m.el = document.createElement('div'); m.el.className = 'mask';
  $('modals').appendChild(m.el); MS.push(m);
  renderModal(m);
  return m;
}
function renderModal(m) {
  if (!m.el.isConnected) return;
  const ob = m.el.querySelector('.mbody'); const st = ob ? ob.scrollTop : 0;
  for (const k of m.keys) delete CBS[k];
  m.keys = []; curKeys = m.keys;
  let body; try { body = m.render(m); } catch (e) { console.error(e); body = '<div class="muted">畫面錯誤：' + e.message + '</div>'; }
  const x = m.noClose ? '' : `<button class="xbtn" onclick="${cb(() => closeModal(m))}">×</button>`;
  curKeys = null;
  const top = m.kind === 'ev' ? `<div class="eave">${EAVE_SVG}<div class="plaque">${m.title}</div></div>` : `<div class="roller"><span class="rt ${m.ribbon ? 'ribbon' : ''}">${m.title}</span></div>`;
  const bottom = m.kind === 'ev' ? '' : '<div class="roller"></div>';
  m.el.innerHTML = `<div class="mwrap ${m.kind}${m.first ? '' : ' noanim'}">${top}${x}<div class="mbody">${body}</div>${bottom}</div>`;
  m.first = false;
  const nb = m.el.querySelector('.mbody'); if (nb) nb.scrollTop = st;
}
function closeModal(m) {
  const i = MS.indexOf(m); if (i < 0) return;
  MS.splice(i, 1); for (const k of m.keys) delete CBS[k];
  m.el.remove();
  if (m.onClose) m.onClose();
  G.treeDirty = true;
  save();
}
const closeAll = () => { while (MS.length) closeModal(MS[MS.length - 1]); };

/* ---------- 佇列處理 ---------- */
function pump() {
  if (MS.length || !Q.length) return;
  const it = Q.shift();
  const p = it.pid ? P(it.pid) : null;
  switch (it.type) {
    case 'event':      if (p && p.alive) eventModal(it); break;
    case 'zhuazhou':   if (p && p.alive && !p.talent) zhuazhouModal(p); break;
    case 'qimeng':     if (p && p.alive && !p.edu) qimengModal(p); break;
    case 'liye':       if (p && p.alive && !p.job) liyeModal(p); break;
    case 'exam':       if (p && p.alive) examModal(p, it.i); break;
    case 'succession': if (G.headId === it.pid) successionModal(p); break;
    case 'confiscate': if (p) confiscateModal(p); break;
    case 'info':       infoModal(it); break;
    case 'gameover':   gameOverModal(); break;
    // 帝王模式（5b 區塊）
    case 'eev':        if (isEmp()) eevModal(it); break;
    case 'ememo':      if (isEmp()) memoModal(it); break;
    case 'esucc':      if (isEmp()) esuccModal(it); break;
    case 'efall':      if (isEmp()) efallModal(it); break;
    case 'eaccession': if (isEmp()) accessionModal(); break;
    case 'ezhihun':    if (isEmp() && p && p.alive && !p.out && !isMarried(p)) zhihunModal(p); break;
    case 'etutor':     if (isEmp() && p && p.alive && !p.edu) tutorModal(p); break;
  }
  G.treeDirty = true;
}

/* ---------- 事件彈窗 ---------- */
function eventModal(it) {
  const e = EVENTS.find(x => x.id === it.id), p = P(it.pid);
  if (!e) return;
  if (!eventTargets(e).includes(p)) return;   // 排隊期間條件已改變（例如已成親）就跳過
  G.seen[e.id] = monthIndex();
  if (e.perPerson) { G.seenP = G.seenP || {}; G.seenP[e.id + ':' + p.id] = monthIndex(); }
  let pre = [];
  if (e.fx) {
    if (it.foreseen || (G.foresee && e.cond && e.cond.target === 'family' && e.major)) { G.foresee = null; hint('算命先生早有預言，家族早有準備，避開了天災的損害！'); }
    else pre = applyFx(e.fx, p);
  }
  if (G.autoSmall && isSmallEvent(e)) {
    const oi = autoOption(e, p); const r = resolveOption(e, p, oi);
    hint(`【${e.title}】${p.name}：${tpl(e.options[oi].text, p)}${r.checked ? (r.ok ? '，成功' : '，失敗') : ''}`);
    afterEvent(); return;
  }
  openModal({ kind:'ev', title:e.title, noClose:true, render:m => {
    let h = `<div class="jobtag">【${jobTitle(p)}】</div>${miniCard(p)}`;
    if (!m.res) {
      h += `<div class="wbox">${tpl(e.text, p)}${pre.length ? '<div>' + fxView(pre) + '</div>' : ''}</div>`;
      h += e.options.map((o, i) => {
        const c = optCost(o);
        const ok = optOK(o);
        return `<button class="opt" ${ok ? '' : 'disabled'} onclick="${cb(() => { m.res = resolveOption(e, p, i); renderModal(m); })}">${tpl(o.text, p)}${c ? `<span class="cost">${silverIcon()}-${fmt(c)}兩</span>` : ''}${o.check ? `<span class="rate">成功率 ${chanceOf(p, o.check)}%</span>` : ''}${o.req ? `<span class="reqt">${reqText(o.req)}</span>` : ''}</button>`;
      }).join('');
      return h;
    }
    const r = m.res;
    return h + `<div class="wbox">${r.checked ? `<div class="verdict ${r.ok ? 'ok' : 'ng'}">${r.ok ? '成功' : '失敗'}</div><br>` : ''}${r.text}</div><div>${fxView(r.out, r)}</div>
      <button class="btn" onclick="${cb(() => { closeModal(m); afterEvent(); })}">確定</button>`;
  } });
}
function afterEvent() {
  if (G._openMatch) { const p = P(G._openMatch); delete G._openMatch; if (p && p.alive) matchModal(p); }
  G.treeDirty = true; save();
}

/* ---------- 跑商 ---------- */
function tradeModal(pre) {
  openModal({ kind:'sc', title:'跑商', ribbon:true, live:true, render:m => {
    const t = G.trade;
    if (!m.sel) m.sel = (pre || []).filter(id => P(id).alive && !P(id).trading);
    const ids = t ? t.members : m.sel;
    const secs = t ? Math.ceil(tradeRemainMonths(t) / G.speed) : TRADE_LEGS.reduce((s, l) => s + l.months, 0);
    const clock = [Math.floor(secs / 3600), Math.floor(secs / 60) % 60, secs % 60].map(x => String(x).padStart(2, '0')).join(':');
    const slots = Array.from({ length:TRADE_MAX_MEMBERS }, (_, i) => ids[i] ? `<div class="sl" ${t ? '' : `onclick="${cb(() => { m.sel.splice(i, 1); renderModal(m); })}"`}>${avatarSVG(P(ids[i]))}</div>`
      : `<div class="sl" ${t ? '' : `onclick="${cb(() => pickMemberModal('選取族人', tradeEligible().filter(p => !m.sel.includes(p.id)), p => { m.sel.push(p.id); renderModal(m); }))}"`}>${t ? '' : '+'}</div>`).join('');
    let h = tradeMapSVG(t) + `<div class="tinfo"><span class="tclock">${clock}</span><span>跑商中 (${t ? t.leg : 0}/${TRADE_LEGS.length})</span></div>`;
    h += `<div class="slot5">${slots}</div><div class="tinfo"><span>已獲得：${ICON.silver.replace('<svg', '<svg width="20" height="20" style="vertical-align:-5px"')} 銀錠 ${fmt(t ? t.earned : 0)}</span><span class="muted">${t ? '目前：' + (TRADE_LEGS[t.leg] ? TRADE_LEGS[t.leg].from + '→' + TRADE_LEGS[t.leg].to : '') : '路線：長安→洛陽→揚州→杭州→廣州'}</span></div>`;
    if (t) {
      h += t.log.length ? `<div class="resume">${t.log.map(l => `<div>${l}</div>`).join('')}</div>` : '';
      const qc = quickTradeCost();
      h += `<button class="btn org" ${G.tokens >= qc ? '' : 'disabled'} onclick="${cb(() => { quickTrade(); renderModal(m); })}">快速到達<small>消耗家族令 ×${qc}</small></button>`;
    } else {
      const est = TRADE_LEGS.reduce((s, l) => s + tradeLegGain(l, m.sel), 0);
      h += `<div class="muted">點「+」選擇最多 ${TRADE_MAX_MEMBERS} 位族人同行。收益依同行族人的情商和人數計算，途中可能遇到山賊、奇貨或貴人；跑商期間族人沒有薪水。</div>
        <button class="btn" ${m.sel.length ? '' : 'disabled'} onclick="${cb(() => { const r = startTrade(m.sel); if (!r.ok) hint(r.msg); renderModal(m); })}">出發<small>預估收益約 ${fmt(est)} 兩</small></button>`;
    }
    return h;
  } });
}

function buildingModal(id) {

  openModal({ kind:'sc', title:b.name, live:true, render:m => {
    const bs = G.buildings[id];
    let h = `<div style="position:relative;height:130px"><div class="bld ${bs ? '' : 'locked'}" style="width:180px;margin:0 auto;height:130px">${buildingSVG(b, bs ? bs.lv : 1)}<div class="sign">${b.name}</div>${bs && bs.closed > 0 ? '<div class="closed">停業</div>' : ''}</div></div>`;
    if (b.kind === 'home') h += `<div class="box">${b.desc}<br>人口上限 +${b.cap}（每級再 +2）、全家每年心情 +${b.mood}（× 等級）<br>目前人口 <b>${livingMembers().length} / ${popCap()}</b>（超過上限時很難生育）</div>`;
    else h += `<div class="box">風險：${b.riskText}<br>${bs ? `Lv${bs.lv}・月收益 <b style="color:var(--up)">${fmtS(buildingIncome(id))}</b> 兩${bs.closed > 0 ? `（停業中，剩 ${bs.closed} 月）` : ''}` : `預估月收益 ${fmtS(buildingIncome(id, 1))} 兩`}<div class="muted">名聲×${fameMul().toFixed(2)}・帳房×${clerkMul().toFixed(2)}・家主×${headMul().toFixed(2)}${boostMul(id) !== 1 ? '・事件×' + boostMul(id).toFixed(2) : ''}</div></div>`;
    if (!bs) h += `<button class="btn" ${G.silver >= b.price ? '' : 'disabled'} onclick="${cb(() => buyBuilding(b, m))}">購買<small>${fmt(b.price)} 兩</small></button>`;
    else if (bs.lv < BUILDING_MAX_LV) { const uc = upgradeCost(b, bs.lv); h += `<button class="btn" ${G.silver >= uc ? '' : 'disabled'} onclick="${cb(() => { G.silver -= uc; bs.lv++; bs.invested += uc; hint(`${b.name}升至 Lv${bs.lv}`); renderModal(m); renderStreet(); save(); })}">升級至 Lv${bs.lv + 1}<small>${fmt(uc)} 兩${b.kind === 'shop' ? '｜月收益 → ' + fmtS(buildingIncome(id, bs.lv + 1)) : ''}</small></button>`; }
    else h += `<div class="box center">已達最高等級</div>`;
    if (bs && b.kind === 'shop') {
      const used = new Set(Object.values(G.buildings).map(x => x.manager).filter(Boolean));
      h += `<div class="sec">掌櫃：${bs.manager === 'butler' ? '管家' : bs.manager && P(bs.manager) ? P(bs.manager).name : '無（收益 ×0.8）'}</div><div class="list">`;
      for (const p of livingMembers().filter(p => ageOf(p) >= 16 && !p.trading && (!used.has(p.id) || bs.manager === p.id)))
        h += liPerson(p, `<button class="btn sm" onclick="${cb(() => { bs.manager = bs.manager === p.id ? null : p.id; renderModal(m); renderStreet(); })}">${bs.manager === p.id ? '撤下' : '指派'}</button>`);
      const freeB = (G.servants.butler ? 1 : 0) - Object.values(G.buildings).filter(x => x.manager === 'butler').length;
      if (freeB > 0 || bs.manager === 'butler') h += `<div class="li"><div class="grow"><b>家丁・管家</b><div class="muted">倍率 ×1.10</div></div><button class="btn sm" onclick="${cb(() => { bs.manager = bs.manager === 'butler' ? null : 'butler'; renderModal(m); })}">${bs.manager === 'butler' ? '撤下' : '指派'}</button></div>`;
      h += '</div>';
    }
    return h;
  } });
}
function buyBuilding(b, m) {
  G.silver -= b.price;
  G.buildings[b.id] = { lv:1, manager:null, closed:0, invested:b.price };
  flog(`購置${b.name}`);
  if (!G.firstProperty) { G.firstProperty = true; G.gold += 1; centerTip('首次購置房產！獲得金條 ×1，可以去「藏品」開寶箱'); }
  else hint(`購置了${b.name}`);
  renderModal(m); renderStreet(); save();
}

/* ---------- 族譜樹 ---------- */
const CW = 100, CH = 120, GX = 22, GY = 64, CG = 18;
function layoutTree() {
  const W = {};
  const kids = p => p.children.map(P).filter(Boolean);
  const sp = p => p.spouseId && P(p.spouseId);
  const width = p => { let cw = 0; kids(p).forEach((k, i) => { cw += width(k) + (i ? GX : 0); }); return (W[p.id] = Math.max(sp(p) ? CW * 2 + CG : CW, cw)); };
  const root = P(G.rootId); width(root);
  const nodes = [], lines = []; let maxY = 0;
  const place = (p, left, depth) => {
    const cx = left + W[p.id] / 2, y = depth * (CH + GY);
    maxY = Math.max(maxY, y + CH);
    let px;
    if (sp(p)) { px = cx - CG / 2 - CW; nodes.push({ p:sp(p), x:cx + CG / 2, y }); lines.push(`M${px + CW} ${y + CH / 2}H${cx + CG / 2}`); }
    else px = cx - CW / 2;
    nodes.push({ p, x:px, y });
    const ks = kids(p);
    if (ks.length) {
      const tw = ks.reduce((s, k, i) => s + W[k.id] + (i ? GX : 0), 0);
      let l = cx - tw / 2; const busY = y + CH + GY / 2, centers = [];
      for (const k of ks) { centers.push(place(k, l, depth + 1)); l += W[k.id] + GX; }
      lines.push(`M${cx} ${sp(p) ? y + CH / 2 : y + CH}V${busY}`, `M${Math.min(cx, ...centers)} ${busY}H${Math.max(cx, ...centers)}`);
      for (const c of centers) lines.push(`M${c} ${busY}V${busY + GY / 2}`);
    }
    return px + CW / 2;
  };
  place(root, 0, 0);
  return { nodes, lines, w:W[root.id], h:maxY };
}
function renderTree() {
  if (!G || !P(G.rootId)) return;
  const L = layoutTree(); treeNodes = L.nodes;
  const pend = new Set(Q.filter(x => x.pid).map(x => x.pid));
  const html = L.nodes.map(n => {
    const p = n.p, net = personNet(p);
    const cls = ['pcard', p.gender === 'f' ? 'f' : '', p.alive ? '' : 'dead', p.id === G.headId ? 'head' : '', G.justBorn === p.id ? 'born' : ''].join(' ');
    let tag = imperialTitle(p) ? imperialTitle(p).replace(G.emp ? G.emp.dynasty : '', '') : p.trading ? '跑商中' : p.mengzhu ? '武林盟主' : p.job === 'official' ? JOB_LINES.official.ranks[p.rank] : p.id === G.heirId ? '繼承人' : p.tag && p.alive ? p.tag : '';
    return `<div class="${cls}" data-pid="${p.id}" style="left:${n.x}px;top:${n.y}px"><div class="ag">${ageOf(p)}</div><div class="nm">${p.name}</div>${avatarSVG(p, 'av')}
      ${p.alive ? (isEmp() ? '' : `<div class="in ${net < 0 ? 'neg' : ''}">${fmtS(net)}兩/月</div>`) : `<div class="in gray">${p.by}-${p.dy}</div>`}${tag ? `<div class="tagx">${tag}</div>` : ''}${pend.has(p.id) && p.alive ? '<div class="pend">❓</div>' : ''}</div>`;
  }).join('');
  // 卡片放在 #tree-cards，月收支浮字直接掛在 #tree-world，重繪卡片時不會被清掉
  let cards = $('tree-cards');
  if (!cards) { $('tree-world').innerHTML = '<div id="tree-cards"></div>'; cards = $('tree-cards'); }
  cards.innerHTML = `<svg class="lines" width="${L.w}" height="${L.h}"><path d="${L.lines.join('')}" stroke="#6b5444" stroke-width="3" fill="none" stroke-linecap="round"/></svg>` + html;
  G.justBorn = null;
  applyView();
}
function applyView() { const w = $('tree-world'); w.style.transform = `translate(${VIEW.x}px,${VIEW.y}px) scale(${VIEW.z})`; w.classList.toggle('mini', VIEW.z < 0.5); $('zoom').value = VIEW.z; }
function locateHead() {
  const n = treeNodes.find(x => x.p.id === G.headId), vp = $('tree-vp'); if (!n) return;
  VIEW.x = vp.clientWidth / 2 - (n.x + CW / 2) * VIEW.z; VIEW.y = vp.clientHeight / 2.8 - (n.y + CH / 2) * VIEW.z; applyView();
}
function setZoom(z, cx, cy) {
  const vp = $('tree-vp'); cx = cx ?? vp.clientWidth / 2; cy = cy ?? vp.clientHeight / 2;
  z = clamp(z, 0.25, 1.3); const wx = (cx - VIEW.x) / VIEW.z, wy = (cy - VIEW.y) / VIEW.z;
  VIEW.z = z; VIEW.x = cx - wx * z; VIEW.y = cy - wy * z; applyView();
}
function bindTree() {
  const vp = $('tree-vp'), pts = new Map(); let drag = null, moved = false, pinch = null;
  vp.addEventListener('pointerdown', e => { pts.set(e.pointerId, { x:e.clientX, y:e.clientY }); moved = false;
    if (pts.size === 1) drag = { sx:e.clientX, sy:e.clientY, vx:VIEW.x, vy:VIEW.y };
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d:Math.hypot(a.x - b.x, a.y - b.y), z:VIEW.z }; drag = null; } });
  addEventListener('pointermove', e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pinch && pts.size === 2) { const [a, b] = [...pts.values()]; setZoom(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d); moved = true; return; }
    if (!drag) return; const dx = (e.clientX - drag.sx) / PHONE_SCALE, dy = (e.clientY - drag.sy) / PHONE_SCALE;
    if (Math.hypot(dx, dy) > 6) moved = true; if (moved) { VIEW.x = drag.vx + dx; VIEW.y = drag.vy + dy; applyView(); } });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) drag = null; };
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
  vp.addEventListener('click', e => { if (moved) return; const c = e.target.closest('.pcard'); if (c) { const p = P(+c.dataset.pid); if (p) personModal(p); } });
  vp.addEventListener('wheel', e => { e.preventDefault(); const r = vp.getBoundingClientRect(); setZoom(VIEW.z * (e.deltaY < 0 ? 1.1 : 0.9), (e.clientX - r.left) / PHONE_SCALE, (e.clientY - r.top) / PHONE_SCALE); }, { passive:false });
  $('zoom').addEventListener('input', e => setZoom(+e.target.value));
  $('btn-locate').addEventListener('click', locateHead);
}

/* ---------- 奇遇樹 ---------- */
function advState(id) { return G.adv[id] || (G.adv[id] = { path:['a'], done:false }); }
function advUnlocked(i) { return i === 0 || advState(ADVENTURES[i - 1].id).done; }
function renderAdv() {
  if (curView !== 'adv') return;
  let h = `<div class="center muted" style="margin-top:8px">每前進一個節點消耗家族令 ×${ADVENTURE_COST}（目前 ${G.tokens}）</div>`;
  ADVENTURES.forEach((line, li) => {
    const st = advState(line.id), unlocked = advUnlocked(li);
    const W = 350, path = st.path, cur = path[path.length - 1];
    let lines = '', nodes = '';
    for (const id in line.nodes) {
      const n = line.nodes[id];

    }

function advNode(lineId, nodeId) {
  const li = ADVENTURES.findIndex(x => x.id === lineId), line = ADVENTURES[li], st = advState(lineId), n = line.nodes[nodeId];

    if (n.ending) return h + `<button class="btn" onclick="${cb(() => { G.tokens -= ADVENTURE_COST; m.reward = advReward(n.reward); st.done = true; flog(`完成奇遇「${line.title}」：${n.title}`); renderModal(m); })}">迎接結局（家族令 ×${ADVENTURE_COST}）</button>`;

      return `<button class="btn ${cls}" style="flex:1" ${ok ? '' : 'disabled'} onclick="${cb(() => { G.tokens -= ADVENTURE_COST; if (c) G.silver -= c; st.path.push(o.to); closeModal(m); renderAdv(); centerTip('劇情推進：' + line.nodes[o.to].title); })}">${o.text}${c ? `<small>-${fmt(c)}兩</small>` : ''}${o.req ? `<small>${reqText(o.req)}</small>` : ''}</button>`; };

function advReward(r) {
  const out = [];

  if (r.tokens) applyFx({ tokens:r.tokens }, head(), out);
  if (r.fame) applyFx({ fame:r.fame }, head(), out);

  if (r.join) { const j = r.join; const p = adoptPerson({ name:G.surname + randomGiven(j.gender), gender:j.gender, age:j.age, stats:{ ...j.stats }, apt:j.apt, tag:j.tag }); s += `<br>✨ ${p.name}（${j.name}）以${j.tag}身分加入了家族！`; }

function migrateSave() {
  if (G.offVer === 2) return;
  const map = [2, 3, 8, 10, 11, 11, 10, 12, 14];
  for (const p of Object.values(G.people)) if (p.job === 'official') p.rank = map[p.rank] ?? p.rank;
  if (G.stats.maxOfficial >= 0) G.stats.maxOfficial = map[G.stats.maxOfficial] ?? G.stats.maxOfficial;
  G.offVer = 2;
}
function startGame(fresh) {
  migrateSave();
  migrateEmperorSave();   // 舊版帝王模式存檔：重新跑一次登基收束
  settleFrozenClan();     // 舊存檔：補上宗親在「不模擬期間」的生老病死
  if (isEmp()) for (const id in G.emp.crises) G.emp.crises[id].queued = false;
  LIVE = null; buildNav(); switchView(isEmp() ? 'court' : 'family');
  VIEW = { x:20, y:20, z:0.8 }; renderTree(); locateHead(); updateHUD();
  if (isEmp() && G.emp.fallen) enqueue({ type:'efall', reason:'王朝已經覆滅' });
  else if (isEmp() && head() && (!head().alive || head().out)) enqueue({ type:'esucc', pid:G.headId, reason:head().out || G.emp.pendingEnding || 'natural' });
  else if (head() && !head().alive && !G.over) enqueue({ type:'succession', pid:G.headId });
  for (const p of livingMembers()) if (!p.talent && ageOf(p) < 2 && !Q.some(x => x.pid === p.id)) enqueue({ type:'zhuazhou', pid:p.id });
  if (G.over) enqueue({ type:'gameover' });
  // 無業開局（例如孤兒）：一開始就讓玩家選擇讀書或職業
  if (fresh && head() && !head().job) enqueue({ type:'liye', pid:G.headId });
  centerTip(fresh ? `歡迎來到 ${START_YEAR} 年，${G.surname}氏家族的故事開始了！` : isEmp() ? `吾皇萬歲！${G.emp.dynasty}國運昌隆` : `歡迎回來，${G.surname}氏家主`);
}
let lastT = performance.now(), acc = 0, saveT = 0;
function frame(t) { try { frameBody(t); } catch (e) { console.error('[主迴圈錯誤]', e); } requestAnimationFrame(frame); }
function frameBody(t) {
  const dt = Math.min(1000, t - lastT); lastT = t;
  if (!G || introOn) return;
  saveT += dt; if (saveT >= 10000) { save(); saveT = 0; }   // 每 10 秒自動存檔
  pump();
  // 帝王模式「度過這一年」：快速推進到明年正月，遇到事件、奏摺就停下
  if (isEmp() && G.emp.ffTo && !MS.length && !Q.length && !G.over) {
    let k = 0; while (k < 3 && isEmp() && monthIndex() < G.emp.ffTo && !MS.length && !Q.length) { monthTick(); k++; }
    if (isEmp() && monthIndex() >= G.emp.ffTo) G.emp.ffTo = 0;
    acc = 0; renderCourt(); updateHUD();
  }
  if (!G.paused && !MS.length && !Q.length && !G.over) {    // 有任何彈窗時，時間自動暫停
    acc = Math.min(acc + dt * G.speed, 6000);
    let n = 0;
    // 畫面掉幀時一幀可補跑多個月，確保速度倍率準確；遇到事件立刻停下
    while (acc >= 1000 && n < 6 && !MS.length && !Q.length && !G.over) { acc -= 1000; n++; monthTick(); }
    if (n) {
      if (Q.length) acc = 0;
      if (curView === 'street') renderStreet();
      if (curView === 'court') renderCourt();
      G.treeDirty = true;
      updateHUD();
    }
  }
  if (G.treeDirty && t - lastTreeRender > 250 && curView === 'family') { G.treeDirty = false; lastTreeRender = t; renderTree(); }
  if (t - lastHud > 400) { lastHud = t; updateHUD(); }
}

  if (G) startGame(false); else showIntro();
  addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  requestAnimationFrame(frame);
}

// 皇室分支圖：皇帝 → 后妃 → 子女（在京方框、分封圓圈）→ 展開的皇孫；其他各王一脈與宗室在下方
function royalChart() {
  const E = G.emp, emp = head();
  const BW = 84, BH = 64, CR = 46, GX = 12;
  const nodes = [], lines = [];
  const cons = consorts().sort((a, b) => a.consort.rank - b.consort.rank);
  const mIdx = k => { const i = cons.findIndex(c => c.id === k.motherId || c.id === k.fatherId); return i < 0 ? 99 : i; };
  const kids = empKids(true).filter(k => k.alive && !['heqin', 'wed', 'deposed', 'captured'].includes(k.out)).sort((a, b) => mIdx(a) - mIdx(b) || a.by - b.by);
  const kidBranch = k => k.out && k.out.startsWith('b:') ? branchOf(k.out.slice(2)) : null;
  const rows = [];
  rows.push([{ t:'box', p:emp, cls:'emp' }]);
  rows.push(cons.map(c => ({ t:'box', p:c, cls:'consort' })));
  const kidRow = kids.map(k => kidBranch(k) ? { t:'circ', b:kidBranch(k), mi:mIdx(k) } : { t:'box', p:k, cls:k.id === G.heirId ? 'heir' : '', mi:mIdx(k) });
  rows.push(kidRow);
  const grand = [];
  for (const k of kids) if (!kidBranch(k) && EXPANDED.has(k.id)) for (const id of k.children) { const g = P(id); if (g && g.alive && !g.out) grand.push({ t:'box', p:g, cls:'grand', parent:k.id }); }
  rows.push(grand);
  const kidBranchIds = new Set(kids.map(kidBranch).filter(Boolean).map(b => b.id));
  rows.push(E.branches.filter(b => !kidBranchIds.has(b.id)).map(b => ({ t:'circ', b })));
  rows.push(E.zongshi.count > 0 ? [{ t:'zong' }] : []);
  const wOf = n => n.t === 'box' ? BW : CR * 2;
  const rowW = r => r.reduce((s, n) => s + wOf(n), 0) + Math.max(0, r.length - 1) * GX;
  const W = Math.max(340, ...rows.map(rowW)) + 24;
  let y = 8; const ys = [];
  rows.forEach((r, i) => { ys.push(y); if (r.length) y += (r.some(n => n.t !== 'box') ? CR * 2 : BH) + 34; });
  rows.forEach((r, i) => { let x = (W - rowW(r)) / 2; for (const n of r) { n.x = x; n.y = ys[i]; n.cx = x + wOf(n) / 2; n.top = ys[i]; n.bot = ys[i] + (n.t === 'box' ? BH : CR * 2); x += wOf(n) + GX; } });
  const E0 = rows[0][0];
  const bus = (from, list, cls) => { if (!list.length) return; const yb = list[0].top - 16;
    lines.push({ d:`M${from.cx} ${from.bot}V${yb}`, cls }); lines.push({ d:`M${Math.min(from.cx, ...list.map(n => n.cx))} ${yb}H${Math.max(from.cx, ...list.map(n => n.cx))}`, cls });
    for (const n of list) lines.push({ d:`M${n.cx} ${yb}V${n.top}`, cls:n.t === 'box' ? cls : 'dash' }); };
  bus(E0, rows[1], 'solid');
  // 子女連到生母；生母不在後宮（已故或為太妃）的，連到皇帝
  const byMom = new Map(); for (const n of rows[2]) { const k = n.mi < 99 ? n.mi : -1; if (!byMom.has(k)) byMom.set(k, []); byMom.get(k).push(n); }
  for (const [mi, list] of byMom) { const from = mi >= 0 ? rows[1][mi] : E0; const yb = list[0].top - 16 - (mi >= 0 ? 0 : 8);
    lines.push({ d:`M${from.cx} ${from.bot}V${yb}`, cls:'solid' }); lines.push({ d:`M${Math.min(from.cx, ...list.map(n => n.cx))} ${yb}H${Math.max(from.cx, ...list.map(n => n.cx))}`, cls:'solid' });
    for (const n of list) lines.push({ d:`M${n.cx} ${yb}V${n.top}`, cls:n.t === 'box' ? 'solid' : 'dash' }); }
  for (const k of rows[2].filter(n => n.t === 'box')) { const gs = rows[3].filter(g => g.parent === k.p.id); if (gs.length) bus(k, gs, 'solid'); }
  const lastKidBot = Math.max(...[...rows[2], ...rows[3], ...rows[1], E0].map(n => n.bot));
  for (const n of rows[4]) lines.push({ d:`M${E0.cx} ${E0.bot}C${E0.cx} ${lastKidBot + 10} ${n.cx} ${n.top - 40} ${n.cx} ${n.top}`, cls:'dash' });
  for (const n of rows[5]) lines.push({ d:`M${E0.cx} ${E0.bot}C${E0.cx - 60} ${lastKidBot + 30} ${n.cx} ${n.top - 60} ${n.cx} ${n.top}`, cls:'dot' });
  const nodeHTML = n => {
    if (n.t === 'box') { const p = n.p, t = (empTitle(p) || '').replace(E.dynasty, ''), gk = p.children.filter(id => P(id) && P(id).alive && !P(id).out).length;
      const click = p.consort ? `consortModal(${p.id})` : empKids(true).includes(p) ? `princeModal(${p.id})` : `personModal(P(${p.id}))`;
      return `<div class="enode ${p.gender} ${n.cls}" style="left:${n.x}px;top:${n.y}px;width:${BW}px;height:${BH}px" onclick="${click}">${avatarSVG(p, 'eav')}<b>${p.name}</b><small>${t}・${ageOf(p)}</small>${n.cls !== 'emp' && n.cls !== 'consort' && n.cls !== 'grand' && gk ? `<span class="exp" onclick="event.stopPropagation();toggleExpand(${p.id})">${EXPANDED.has(p.id) ? '−' : '+' + gk}</span>` : ''}</div>`; }
    if (n.t === 'circ') { const b = n.b; return `<div class="ecirc ${b.kind === 'old' ? 'old' : ''}" style="left:${n.x}px;top:${n.y}px;width:${CR * 2}px;height:${CR * 2}px" onclick="branchModal('${b.id}')"><b>${b.title}</b><small>一脈 ${b.count} 人</small><small>勢${b.power}・忠${b.loyalty}</small></div>`; }
    return `<div class="ecirc zong" style="left:${n.x}px;top:${n.y}px;width:${CR * 2}px;height:${CR * 2}px" onclick="zongshiModal()"><b>宗室</b><small>${E.zongshi.count} 人</small><small>勢力 ${natV('zongshi')}</small></div>`;
  };
  const all = rows.flat();

const KEYMAP = {
  pause:  [' ', 'p', 'P'],           // 暫停／繼續
  help:   ['h', 'H', '?'],           // 快捷鍵說明
  faster: ['+', '='],                // 加速

  zoomIn: [']'], zoomOut: ['['],     // 族譜縮放
  pan:    { ArrowLeft:[1, 0], ArrowRight:[-1, 0], ArrowUp:[0, 1], ArrowDown:[0, -1] }   // 族譜平移方向
};
const PAN_STEP = 80;   // 方向鍵每次平移的距離

function togglePause(force) {
  if (!G || introOn) return;
  G.paused = force === undefined ? !G.paused : force;
  updateHUD(); save();
  centerTip(G.paused ? '⏸ 已暫停（按空白鍵繼續）' : '▶ 時間繼續流動');
}
function setSpeedIndex(i) {
  i = clamp(i, 0, SPEEDS.length - 1);
  if (SPEEDS[i] === G.speed) return;
  G.speed = SPEEDS[i]; updateHUD(); save();
  centerTip(`速度 ×${G.speed}`);
}
// 彈窗內可用數字鍵選擇的按鈕：優先選項按鈕，其次奇遇的左右兩鈕
function modalChoices(m) {
  const opts = [...m.el.querySelectorAll('.mbody .opt')];
  if (opts.length) return opts;
  return [...m.el.querySelectorAll('.mbody .row > .btn')];
}
// Enter：確認結果畫面（避開「重新開始」等危險按鈕）
function modalConfirm(m) {
  if (m.el.querySelector('.mbody .opt:not([disabled])')) return false;
  const btns = [...m.el.querySelectorAll('.mbody .btn:not([disabled])')];
  const safe = btns.find(b => /確定|返回|退朝|知道|好兆頭|光宗|再接|百年好合|繼續|登基|前往朝堂|迎接結局|開藏品/.test(b.textContent) && !/重新開始/.test(b.textContent));
  const b = safe || (btns.length === 1 && !/重新開始/.test(btns[0].textContent) ? btns[0] : null);
  if (b) { b.click(); return true; }
  return false;
}

addEventListener('keydown', e => {
  const k = e.key;
  // 開場畫面：Enter 略過／開始
  if (introOn) {
    if (k === 'Enter' && !(e.target.tagName === 'INPUT')) { const b = $('skipbtn') || $('go'); if (b && !b.disabled) b.click(); }
    return;
  }
  if (!G) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') { if (k === 'Escape') e.target.blur(); return; }   // 輸入文字時不攔截
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const top = MS[MS.length - 1];

  if (KEYMAP.pause.includes(k)) { e.preventDefault(); togglePause(); return; }
  if (KEYMAP.help.includes(k)) { e.preventDefault(); if (!top || top.title !== '鍵盤快捷鍵') keyHelpModal(); return; }
  if (k === 'Escape') {
    e.preventDefault();
    if (top) { if (!top.noClose) closeModal(top); else centerTip('請先做出選擇'); }
    else settingsModal();
    return;
  }
  // 有彈窗時：數字鍵選擇、Enter 確認
  if (top) {
    if (/^[1-9]$/.test(k)) {
      e.preventDefault();
      const b = modalChoices(top)[+k - 1];
      if (b && !b.disabled) b.click(); else if (b) centerTip('這個選項目前無法選擇');
      return;
    }
    if (k === 'Enter') { e.preventDefault(); modalConfirm(top); }
    return;
  }
  // 沒有彈窗時
  if (/^[1-6]$/.test(k)) { setSpeedIndex(+k - 1); return; }
  if (KEYMAP.faster.includes(k)) { setSpeedIndex(SPEEDS.indexOf(G.speed) + 1); return; }
  if (KEYMAP.slower.includes(k)) { setSpeedIndex(SPEEDS.indexOf(G.speed) - 1); return; }
  const ni = KEYMAP.nav.indexOf(k.toLowerCase());
  if (ni >= 0) { const b = document.querySelectorAll('#nav .nbtn')[ni]; if (b) b.click(); return; }
  if (curView === 'family') {
    if (KEYMAP.pan[k]) { e.preventDefault(); VIEW.x += KEYMAP.pan[k][0] * PAN_STEP; VIEW.y += KEYMAP.pan[k][1] * PAN_STEP; applyView(); return; }
    if (KEYMAP.zoomIn.includes(k)) { setZoom(VIEW.z * 1.12); return; }
    if (KEYMAP.zoomOut.includes(k)) { setZoom(VIEW.z / 1.12); return; }
    if (KEYMAP.locate.includes(k)) { locateHead(); return; }
  }
});

/* =====================================================================
 *  【 數值公式與調整位置說明 】
 *
 *  ■ 時間
 *    1x = 每 1 秒 1 個月（frameBody：真實毫秒 × 速度，累積滿 1000 過一個月）；速度檔位 SPEEDS
 *    有任何彈窗或待處理事件時，時間自動暫停。事件間隔：monthTick() 的 G.evTimer = randi(2, 4)
 *    跑商倒數、產業收益、特殊 NPC 停留都以「遊戲月」計算，所以會跟著速度加快
 *
 *  ■ 個人月收支 personNet() = 薪水 − 生活開銷
 *    薪水 salaryOf() = JOB_LINES[職業].salary[職級] × (1 + 相關屬性平均/200) × 時代倍率 × 家主加成 × (1 + 藏品/傳家寶薪俸加成)
 *    生活開銷 livingCost() = LIVING_COST（孩童 2、成人 1.5）× (1 + 在世人數/25) × 時代倍率   → 人口越多開銷越大
 *    時代倍率 eraMul() = 1.5 ^ ((年份-1000)/30)
 *    家主加成 headMul() = 1 + (家主智力 + 家主情商) / 400
 *    開局：18 歲孤身一人，依出身（ORIGINS）決定銀兩、屬性與職業；單身時月收支約 +3～4 兩
 *    成親：開局 FIRST_MATCH_MONTHS 個月內媒婆必定上門；另有「青梅竹馬」「路見不平」等事件可直接成親
 *
 *  ■ 職業路線：JOB_LINES（含從軍 army、經商 merchant）、JOB_GROUPS（讀書／從軍／經商／種田／手藝 分組）、ARMY_GUARD、MERCHANT_TRADE
 *  ■ 皇帝模式（2c 區塊「皇帝模式資料區」、4b 核心、5b 介面）
 *    進入：家族模式改朝換代成功後 → enterEmperorModal()。路線一（毒殺）= 篡位、路線二（起義）= 開國、路線三（受禪，需首輔＋名聲 DYNASTY_ROUTE3_FAME）= 受禪
 *    稱帝方式開局 ACCESSION_TYPES；天命 = 30 + 家族名聲/100 + 調整；皇商年貢 = MERCHANT_BASE + MERCHANT_LOG × log10(1 + 產業年收益萬兩×10)
 *    家族銀兩 ×ACC_PURSE_RATE 轉內帑、×ACC_TREASURY_RATE 轉國庫（上限 ACC_TREASURY_CAP 萬兩）
 *    登基收束 consolidate()：皇帝、后妃、皇帝子孫與配偶、皇帝父母留在京師逐人模擬；其餘族人 p.out='zongshi'
 *    存檔：G.mode = 'family' | 'emperor'；舊版帝王存檔由 migrateEmperorSave() 重跑登基收束
 *    年度財政 empYear()（萬兩，皆乘時代倍率）：
 *      稅收 = EMP_TAX_BASE ×(0.5+民心/100)×(0.7+吏治/200)×(1+稅收加成，上限 EMP_TAX_MOD_CAP)
 *      支出 = 軍餉 EMP_ARMY_COST×兵力×(1+軍餉調整) + 宮廷 EMP_COURT_BASE×(1+0.08×(后妃+皇子女))
 *           + 宗室俸祿 EMP_ZONGSHI_COST×(宗室+各藩人數)^0.85 + 百官 EMP_OFFICIAL_COST×重臣數 + 推動中國策年費
 *      國庫為負：EMP_DEFICIT_PENALTY；稅收 ×EMP_PURSE_SHARE 撥入內帑
 *    每年自然回歸 EMP_DRIFT（民心→50、皇權→50+(情商-55)/2、兵力→50+火器加成、吏治→45+吏治加成+(吏部尚書能力-60)/4、天命→50）
 *    外患每年 + EMP_BORDER_GROWTH×(0.5~1.5) − (兵力-50)/8；宗室與各藩人口 ZONGSHI_GROWTH／BRANCH_GROWTH（接近 ZONGSHI_CAP 時趨緩）
 *    判定成功率 empChance()：屬性判定 = base + (皇帝屬性-50)×0.6 + (皇權-50)×0.15 + (心情-50)×0.1；國勢判定 = base + (數值-50)×0.8
 *    奏摺：每年 1～3 本（planMemorials）；屬實機率 = MEMORIAL_HONESTY_BASE + (忠誠+品德)/400 − 冤殺忠臣×0.04（皇權 > MEMORIAL_HIGH_POWER 時 −0.2，偏向隱瞞）
 *      查證 MEMORIAL_VERIFY；誤信謊報 MEMORIAL_EXPOSE_MONTHS 個月後東窗事發
 *    朝政事件間隔 EMP_EVENT_MONTHS；危機鏈 CRISIS_CHAINS（gap 為階段間隔）；警訊門檻 EMP_THRESHOLDS
 *    聖意 EMP_AP（每年任免、晉封、寵幸、親授課業的次數）；國策 POLICIES2（同時 EMP_POLICY_SLOTS 項，阻力機率 EMP_POLICY_RESIST_RATE）
 *    后妃生育：每月 EMP_BIRTH_RATE ×(寵愛/50)×年齡係數，子女上限 EMP_CHILD_CAP；皇帝 35 歲後每年額外健康 −EMP_STRESS_HP
 *    分封：BRANCH_POWER_GROWTH、BRANCH_REBEL_POWER／BRANCH_REBEL_LOYALTY；封號 FIEF_TITLES、JUNWANG_TITLES
 *    廟號 TEMPLE_RULES、諡號 POSTHUMOUS_RULES、史評 HISTORIAN_PROS／CONS；評分見 reignReport()；結局 EMP_ENDINGS；王朝成就 dy_*
 *    子嗣：后妃可生育者少於 EMP_MIN_CONSORTS 時，登基、新君即位與每年都會自動「大婚」冊立；在位滿 EMP_NOHEIR_XUANXIU 年仍無子嗣，宗人府奏請選秀
 *  ■ 宗族（4c 區塊 clanYear，每年結算）：皇帝一系以外的旁支族人仍逐人成長
 *    婚嫁 CLAN_MARRY_RATE、生育 CLAN_BIRTH_RATE（每家上限 CLAN_MAX_KIDS，逐人記錄上限 CLAN_SIM_CAP，超過的記入宗室遠支）
 *    出路 inheritJob()：父母一方任官或讀書 → 讀書考科舉；否則 CLAN_INHERIT_RATE 機率承襲父母行業；父母都閒居 → CLAN_NOJOB_STUDY 機率讀書
 *    科舉：每屆考上下一級功名機率 = CLAN_EXAM_BASE + (智力-55)/80，考上可接著考；中進士授官階 CLAN_JINSHI_RANK；考核另加 CLAN_ASSESS_BONUS
 *    官至 CLAN_MINISTER_RANK（武官 CLAN_ARMY_RANK）以上，吏部奏請拔擢入朝（派系「宗親」）；CLAN_PICK_RANK 以上可在人物詳情手動拔擢
 *    才德分數 clanScore() = (智力+情商)×0.4 + 武力×0.2 + 官階×2；用於讓賢、宗室賢才事件；讓賢給旁支天命 ABDICATE_TIANMING
 *    新君的兄弟一系受封親王名號後留在宗族中成長（不自動就藩）；想讓某家離京，可在其人物詳情「分封就藩」
 *    平衡參考（模擬）：隨便亂選約 10～80 年亡國；用心經營可傳國 200 年以上；每位皇帝平均在位約 20 年，每年約 3～4 個決定
 *  ■ 媒婆：perPerson 事件每人冷卻 PER_PERSON_COOLDOWN 月；族人 18 歲未婚時 ADULT_MATCH_MONTHS 內必定上門
 *  ■ 啟蒙與立業：QIMENG_AGE（6 歲）選 EDUCATIONS（上私塾才算讀書路線）；JOB_MIN_AGE（16 歲）選讀書或職業
 *    科舉資格 isStudyRoute()：書生、書院任職，或上過私塾且未就業；不設智力門檻（EXAM_MIN_INT = 0）
 *  ■ 熟練度：每月 + (PROF_BASE + 相關屬性平均 × PROF_STAT) / 12，滿 100 升一級（官場改由考核升遷）
 *    屬性 60 時每年約 +14，加上事件獎勵 → 農田 3 次升遷約 16–20 年、其他職業 4 次約 20–25 年達頂級職業
 *
 *  ■ 產業月收益 buildingIncome()
 *    基礎收益 × 2^(等級-1) × 掌櫃倍率 × 名聲倍率 × 帳房 × 事件增益 × 家主加成 × 時代倍率 × (1 + 藏品/傳家寶收益加成)
 *    掌櫃倍率：無掌櫃 0.8；族人 0.8 + (情商+智力)/200×0.8；管家 1.1
 *    名聲倍率 fameMul() = 1 + min(名聲,3000)/3000；酒樓再乘 (1 + min(名聲,3000)/1500)
 *    升級費 upgradeCost() = max(300, 購價) × 2^目前等級 → BUILDINGS、LEVEL_INCOME_MUL、UPGRADE_COST_MUL
 *
 *  ■ 經濟規模縮放 costScale() = max(1, (上月總收入/40)^0.85)
 *    事件的花費與銀兩獎勵、報名費、婚宴、嫁妝、神醫、家丁招募都以第一代基準值乘上它，前後期都有份量
 *
 *  ■ 成功率 chanceOf() = base + (屬性-50)×0.8 + (心情-50)×0.2，限制 5%~95%
 *  ■ 科舉 examChance() = 考試 base + (智力-50) + (心情-50)×0.3 + (作答屬性-50)×0.2 + 作答加成 + 藏品科舉加成（穿越者另有現代知識加成）
 *    殿試分數 = 智力 + 心情×0.3 + 作答加成 + 隨機(0~40)，對照 DIANSHI_RANKS
 *  ■ 官職：JOB_LINES.official（十六階，grades 為品級，參考明制）；TAIFU_RANK、PREMIER_RANK；
 *    入仕：殿試 DIANSHI_RANKS、候補 HOUBU_RANK（舉人→典史、貢士→縣主簿）、捐官 JUANGUAN_COST
 *    官員熟練度成長 × OFFICIAL_PROF_MUL；升遷門檻 = ASSESS_PROMOTE + 官階 × ASSESS_STEP（上限 ASSESS_CAP）
 *  ■ 官員考核 assessAll()（每 3 年）：分數 = (智力+情商)/2 + 熟練度×ASSESS_PROF_W + 隨機(±12)；另有 8 個升官事件（2b 區塊 E，cond.prof／cond.maxRank）
 *    熟練度滿 100 且 ≥ ASSESS_PROMOTE + 官階×5（上限 104）才升官；≤ ASSESS_DEMOTE 貶官；情商 < IMPEACH_EQ 有 50% 被彈劾，< CONFISCATE_EQ 抄家
 *  ■ 生育 births()：每月 2.8% × 年齡係數 × (1 + 奶娘×15%)，超過人口上限 × CROWD_BIRTH_MUL × (上限/人口)^4
 *  ■ 資質 bear()：父母智力/情商/武力平均×0.6 + 隨機(0~45)，<35 下品、<52 中品、<66 上品、其餘天縱奇才
 *  ■ 老化 yearTick()：40 歲後每年健康 -(1 + (年齡-40)×0.12)；壽命 60~100 隨機 + 藏品壽命加成
 *  ■ 跑商 tradeLegGain() = 段落 base × max(15, 月收入) × (0.5 + Σ情商/120) × (1 + 人數×8%) × (1 + 藏品跑商加成)
 *  ■ 武林盟主：每場勝率 = 50 + (武力 - 對手實力)×4 → MENGZHU_OPPONENTS
 *  ■ 改朝換代條件：家族延續 DYNASTY_MIN_YEARS 年以上，且（太傅）或（武林盟主＋資金 DYNASTY_ROUTE2_SILVER）
 *  ■ 改朝換代成功率 dynastyStatus()：
 *    路線一 = 25 + (太傅智力+情商-120)/2 + 名聲/200；路線二 = 25 + (盟主武力-90)×2 + 名聲/200 + 護院等級×3
 *  ■ 藏品寶箱 gachaPull()：GACHA_RATES、GACHA_PITY_XIAN（8 抽保底仙品）、GACHA_PITY_SHEN（30 抽保底神品）
