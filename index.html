<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>穿越家族志</title>
<style>
/* =====================================================================
 *  樣式：古風 Q 版卡通、粗深色描邊、扁平上色
 *  手機直式 390×844；電腦上等比放大到視窗高度，置中顯示，兩側黑底
 * ===================================================================== */
:root{
  --ink:#2b2a28; --teal:#1f5a55; --teal2:#2e7d74; --mint:#d8f2e3; --paper:#eef8ee;
  --green:#5fc75a; --lime:#a8e05f; --orange:#f0743a; --gold:#f2c14e;
  --up:#249a3a; --down:#d33a2c; --blue:#3a6fb5; --pink:#d0688c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}

/* ---------- 手機框 ---------- */
#phone{position:absolute;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1));
  overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,#c9eedb 0%,#e2f5e7 50%,#f8f5ea 100%)}
body.mobile #phone{left:0;top:0;width:100vw;height:100%;transform:none}
/* ---------- 電腦版：填滿整個視窗的橫式版面 ---------- */
body.desktop{background:#c9eedb}
body.desktop #phone{left:0;top:0;transform:scale(var(--s,1));transform-origin:0 0;box-shadow:none}
body.desktop #topbar{justify-content:center;gap:18px;padding-top:12px}
body.desktop .res{max-width:300px}
body.desktop .mwrap{max-width:560px}
body.desktop .inwrap{max-width:600px;margin:0 auto;width:100%}
body.desktop #centertip div{font-size:18px}
body.desktop #hints{width:auto;max-width:520px}
body.desktop .street-in{max-width:1200px;margin:0 auto}
body.desktop .bgrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
body.desktop #view-adv{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:0 12px}
body.desktop #view-adv > .center{width:100%;margin-bottom:12px}
body.desktop .adv-line{width:370px;flex:none}
body.desktop #view-court .mbody{left:50% !important;right:auto !important;width:min(640px,94%);transform:translateX(-50%)}
body.desktop .wish-btn{bottom:40px}
body.desktop #nav{gap:22px}

/* ---------- 頂部資源列 ---------- */
#topbar{display:flex;gap:8px;padding:10px 10px 2px 18px;z-index:6}
.res{position:relative;flex:1;height:34px;background:rgba(255,255,255,.85);border:2.5px solid var(--ink);border-radius:18px;padding:0 6px 0 26px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.res:first-child{flex:1.45}
.res .ico{position:absolute;left:-14px;top:-6px;width:40px;height:40px}
.res b{font-size:14px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res small{font-size:10px;font-weight:800;color:var(--up);line-height:1.05;white-space:nowrap}
.res small.neg{color:var(--down)}

/* ---------- 標題列 ---------- */
#titlebar{position:relative;height:74px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;z-index:6}
.banner{position:relative;margin-top:4px;background:#c8402f;color:#fff3d0;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:5px 26px;font-weight:900;font-size:20px;letter-spacing:4px;text-shadow:0 2px 0 #7d2216}
.banner::before,.banner::after{content:'';position:absolute;top:-3px;bottom:-3px;width:22px;background:#c8402f;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.banner::before{left:-18px;clip-path:polygon(100% 0,100% 100%,0 50%)}
.banner::after{right:-18px;clip-path:polygon(0 0,100% 50%,0 100%)}
.banner .tip{position:absolute;top:50%;width:26px;height:26px;transform:translateY(-50%) rotate(45deg);background:#c8402f;border:3px solid var(--ink);z-index:-1}
.banner .tip.l{left:-15px}.banner .tip.r{right:-15px}
#btn-set{position:absolute;left:10px;top:6px;width:48px;height:48px}
#btn-set svg{width:48px;height:48px}
#calwrap{position:absolute;right:10px;top:2px;display:flex;flex-direction:column;align-items:center;gap:3px}
.cal{position:relative;width:58px;cursor:pointer}
.cal .rings{height:8px;display:flex;justify-content:space-around;padding:0 8px}
.cal .rings i{width:6px;height:10px;border-radius:3px;background:#666;border:1.5px solid var(--ink);margin-bottom:-4px;z-index:1}
.cal .pg{border:2.5px solid var(--ink);border-radius:7px;overflow:hidden;background:#fff;text-align:center;box-shadow:0 3px 0 var(--ink)}
.cal .cy{background:#d9432f;color:#fff;font-size:12px;font-weight:900;padding:1px 0}
.cal .cm{font-size:16px;font-weight:900;line-height:22px}
.cal .ct{position:absolute;right:-8px;top:4px;font-size:9px;color:#fff;background:#e08a1e;border:1.5px solid var(--ink);border-radius:6px;padding:0 3px;font-weight:900;display:none;transform:rotate(12deg)}
.cal.exam .ct{display:block}
.cal .pp{position:absolute;left:-9px;bottom:-7px;width:22px;height:22px;border-radius:50%;background:var(--green);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.cal .pp svg{width:12px;height:12px}
.cal.paused .pp{background:var(--orange)}
.cal.flip .pg{animation:flip .25s}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(70deg)}100%{transform:rotateX(0)}}
#btn-speed{min-width:44px;height:24px;border-radius:12px;border:2.5px solid var(--ink);background:#ffe9a8;font-weight:900;font-size:12px;box-shadow:0 2px 0 var(--ink)}

/* ---------- 主區 ---------- */
#main{position:relative;flex:1;overflow:hidden}
#mountains{position:absolute;left:0;right:0;bottom:0;height:220px;pointer-events:none;opacity:.5}
.view{position:absolute;inset:0}
#tree-vp{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#tree-world{position:absolute;left:0;top:0;transform-origin:0 0}
#tree-world svg.lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#famelabel{position:absolute;left:50%;top:2px;transform:translateX(-50%);background:rgba(31,90,85,.85);color:#fff;font-size:11px;padding:2px 10px;border-radius:10px;white-space:nowrap;z-index:3}
#zoombar{position:absolute;right:8px;bottom:10px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);border:2.5px solid var(--ink);border-radius:20px;padding:4px 6px 4px 12px;z-index:3}
#zoombar input{width:100px;accent-color:#2e7d74}
#zoombar button{width:32px;height:32px;border-radius:50%;background:#fff2c2;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center}
#zoombar button svg{width:20px;height:20px}

/* 人物卡（約 100×120）*/
.pcard{position:absolute;width:100px;height:120px;border:3px solid #2f5f9e;border-radius:14px;background:#dcecff;text-align:center;cursor:pointer;box-shadow:0 3px 0 rgba(43,42,40,.5)}
.pcard.f{background:#ffe1ea;border-color:#c24d78}
.pcard.dead{background:#d9d9d9;border-color:#777;filter:grayscale(1)}
.pcard.head{box-shadow:0 0 0 4px #ffd34d,0 0 18px 6px rgba(255,200,40,.85)}
.pcard .ag{position:absolute;left:-10px;top:-10px;width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);font-size:12px;font-weight:900;line-height:25px}
.pcard .nm{font-size:13px;font-weight:900;margin-top:3px;white-space:nowrap;overflow:hidden;padding:0 4px}
.pcard .av{width:72px;height:72px;margin:0 auto;display:block}
.pcard .in{font-size:11px;font-weight:900;color:var(--up);white-space:nowrap}
.pcard .in.neg{color:var(--down)}.pcard .in.gray{color:#555}
.pcard .tagx{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);font-size:9.5px;background:#2e7d74;color:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 5px;white-space:nowrap}
.pcard .pend{position:absolute;right:-12px;top:-14px;width:30px;height:30px;border-radius:50%;background:#fff6c8;border:2.5px solid var(--ink);font-size:17px;line-height:25px;animation:bounce .7s infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.pcard.born{animation:born .9s ease}
@keyframes born{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.mini .pcard .nm,.mini .pcard .in,.mini .pcard .tagx{display:none}
.mini .pcard .av{width:92px;height:92px;margin-top:14px}
.mini .pcard .ag{transform:scale(1.5)}
.cardfloat{position:absolute;font-size:13px;font-weight:900;color:var(--up);pointer-events:none;animation:cf 1s ease forwards;text-shadow:0 0 3px #fff,0 0 3px #fff;white-space:nowrap}
.cardfloat.neg{color:var(--down)}
@keyframes cf{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-28px)}}

/* 側邊浮動圖示列 */
.side{position:absolute;top:22px;display:flex;flex-direction:column;gap:6px;z-index:4}
.side.left{left:6px}.side.right{right:6px}
.sicon{position:relative;width:58px;display:flex;flex-direction:column;align-items:center}
.sicon .ic{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.9);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--ink)}
.sicon .ic svg{width:38px;height:38px}
.sicon span{font-size:11px;font-weight:900;color:#fff;margin-top:1px;text-shadow:-1.5px 0 var(--ink),1.5px 0 var(--ink),0 -1.5px var(--ink),0 1.5px var(--ink);white-space:nowrap}
.sicon.npc .bub{position:absolute;right:52px;top:2px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:3px 8px;font-size:11px;font-weight:900;white-space:nowrap;animation:bounce .8s infinite alternate}
.sicon.npc .bub::after{content:'';position:absolute;right:-8px;top:8px;border:5px solid transparent;border-left:7px solid var(--ink)}
.sicon.npc .ic{background:#fff6c8;animation:npcin .5s}
@keyframes npcin{from{transform:scale(0)}to{transform:scale(1)}}
.dot{position:absolute;right:2px;top:-2px;width:14px;height:14px;border-radius:50%;background:#f23b2b;border:2px solid #fff;display:none}
.dot.on{display:block}

/* ---------- 底部導覽（灰綠木柵欄）---------- */
#nav{position:relative;height:92px;display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:0 8px 10px;z-index:6;
  background:
    linear-gradient(#6f8a6c,#6f8a6c) 0 26px/100% 9px no-repeat,
    linear-gradient(#5c7659,#5c7659) 0 62px/100% 9px no-repeat,
    repeating-linear-gradient(90deg,#8fa98a 0 24px,#7a9475 24px 27px,transparent 27px 34px);
  border-top:3px solid var(--ink)}
.nbtn{position:relative;width:62px;height:62px;border-radius:16px;background:#f4f9ee;border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--ink);transition:.2s}
.nbtn svg{width:34px;height:34px}
.nbtn span{font-size:12px;font-weight:900}
.nbtn.active{width:76px;height:76px;background:linear-gradient(#a9f08f,#4cbf45);margin-bottom:2px}
.nbtn.active span{color:#fff;text-shadow:0 1px 0 #2a6a2a}
.nbtn.unlock{animation:unlock 1.2s ease}
@keyframes unlock{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.4) rotate(10deg)}100%{transform:scale(1)}}

/* ---------- 街市 ---------- */
#view-street{overflow-y:auto;overflow-x:hidden;background-color:#b8bcb3;
  background-image:linear-gradient(#a5a9a0 2px,transparent 2px),linear-gradient(90deg,#a5a9a0 2px,transparent 2px);background-size:44px 28px}
.street-in{position:relative;padding:14px 8px 40px}
.street-title{margin:0 auto 6px;width:max-content;background:#6d4520;color:#ffe9b8;border:3px solid var(--ink);border-radius:8px;padding:2px 14px;font-weight:900;letter-spacing:3px}
.fence{height:20px;margin:6px 0;background:repeating-linear-gradient(90deg,#9a6633 0 8px,transparent 8px 22px),linear-gradient(transparent 7px,#8a5a2b 7px,#8a5a2b 12px,transparent 12px)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px}
.bld{position:relative;height:180px;cursor:pointer}
.bld svg.house{position:absolute;left:30px;top:6px;width:140px;height:120px}
.bld.locked svg.house{filter:grayscale(1);opacity:.55}
.sign{position:absolute;left:4px;top:14px;writing-mode:vertical-rl;background:linear-gradient(90deg,#c48a4a,#a86d33);color:#fff4d8;border:2.5px solid var(--ink);border-radius:4px;padding:6px 2px;font-weight:900;font-size:13px;letter-spacing:2px}
.bld .bl{position:absolute;left:24px;right:0;bottom:16px;text-align:center;font-size:12px;font-weight:900}
.bld .bl span{background:rgba(255,255,255,.9);border:2px solid var(--ink);border-radius:10px;padding:1px 8px}
.bld .bl .pr{color:#6b4a2f}.bld .bl .gn{color:var(--up)}
.bld .lv{position:absolute;left:32px;top:2px;font-size:10px;font-weight:900;background:var(--gold);border:2px solid var(--ink);border-radius:8px;padding:0 5px}
.closed{position:absolute;left:78px;top:34px;writing-mode:vertical-rl;color:#fff;background:#8a5a2b;border:2.5px solid var(--ink);border-radius:4px;font-weight:900;font-size:14px;padding:4px 1px;transform:rotate(-8deg)}
.deco{position:absolute;pointer-events:none}

/* ---------- 神樹（許願）---------- */
#view-wish{overflow:hidden;background:linear-gradient(#cfe9f2 0%,#e8f3e6 45%,#d8c8a8 45%,#cbb994 100%)}
.wish-scene{position:absolute;inset:0}
.wish-plus{position:absolute;left:50%;top:150px;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;background:radial-gradient(#fffbe0,#ffe27a);border:3px solid var(--ink);font-size:44px;font-weight:900;line-height:66px;text-align:center;box-shadow:0 0 22px 10px rgba(255,230,120,.9);animation:glow 1.4s infinite alternate;cursor:pointer;z-index:2;overflow:hidden}
.wish-plus svg{width:100%;height:100%}
@keyframes glow{from{box-shadow:0 0 12px 4px rgba(255,230,120,.7)}to{box-shadow:0 0 28px 14px rgba(255,230,120,1)}}
.wish-who{position:absolute;left:50%;top:236px;transform:translateX(-50%);background:rgba(255,255,255,.9);border:2.5px solid var(--ink);border-radius:12px;padding:2px 12px;font-weight:900;font-size:13px;white-space:nowrap;z-index:2}
.wish-btn{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:120px;height:120px;border-radius:50%;background:radial-gradient(#c9ff9a,#4cbf45);border:4px solid var(--ink);color:#fff;font-size:26px;font-weight:900;text-shadow:0 2px 0 #2a6a2a;box-shadow:0 0 0 6px rgba(140,240,110,.5),0 6px 0 var(--ink);animation:glow2 1.6s infinite alternate;z-index:2}
.wish-btn small{display:block;font-size:12px}
@keyframes glow2{from{box-shadow:0 0 0 4px rgba(140,240,110,.4),0 6px 0 var(--ink)}to{box-shadow:0 0 0 14px rgba(140,240,110,.15),0 6px 0 var(--ink)}}
.burst{position:absolute;pointer-events:none;font-size:26px;animation:burst 1.1s ease-out forwards;z-index:5}
@keyframes burst{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}

/* ---------- 奇遇樹 ---------- */
#view-adv{overflow-y:auto;background:linear-gradient(#e9f4e4,#d9ecd8)}
.adv-line{position:relative;margin:10px 10px 18px;background:rgba(255,255,255,.55);border:3px solid var(--teal);border-radius:16px;height:420px}
.adv-line h3{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:var(--teal);color:#fff;font-size:14px;padding:2px 14px;border-radius:10px;border:2.5px solid var(--ink);white-space:nowrap}
.adv-line.lockedline{opacity:.5}
.anode{position:absolute;width:76px;text-align:center;transform:translateX(-50%);cursor:pointer}
.anode .c{width:70px;height:70px;margin:0 auto;border-radius:50%;border:3px solid var(--ink);overflow:hidden;background:#fff;position:relative;box-shadow:0 3px 0 var(--ink)}
.anode .c svg{width:100%;height:100%}
.anode.unk .c{background:#555;color:#fff;font-size:34px;font-weight:900;line-height:64px}
.anode.avail .c{background:#fff6c8;box-shadow:0 0 0 4px #ffd34d,0 3px 0 var(--ink)}
.anode .t{font-size:11px;font-weight:900;margin-top:2px}
.anode .ex{position:absolute;right:0;top:-4px;width:22px;height:22px;border-radius:50%;background:#e8392b;color:#fff;font-weight:900;border:2px solid #fff;line-height:18px;animation:bounce .6s infinite alternate}
.anode.skip{opacity:.35;pointer-events:none}

/* ---------- 彈窗共用 ---------- */
#modals{position:absolute;inset:0;pointer-events:none;z-index:20}
.mask{position:absolute;inset:0;background:rgba(10,20,18,.55);display:flex;align-items:center;justify-content:center;pointer-events:auto}
.mwrap{position:relative;width:92%;max-height:88%;display:flex;flex-direction:column;animation:pop .28s cubic-bezier(.3,1.5,.6,1)}
.mwrap.noanim{animation:none}
@keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
.xbtn{position:absolute;right:-8px;top:-10px;width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;border:3px solid var(--ink);font-size:20px;font-weight:900;z-index:5;line-height:28px;box-shadow:0 2px 0 var(--ink)}
.mbody{background:var(--paper);overflow-y:auto;flex:1;padding:14px 12px;background-image:radial-gradient(rgba(31,90,85,.05) 1px,transparent 1px);background-size:8px 8px}
/* 事件彈窗：中式屋簷 */
.eave{position:relative;height:66px;margin:0 -14px -4px;z-index:2}
.eave svg{position:absolute;inset:0;width:100%;height:100%}
.eave .plaque{position:absolute;left:50%;top:22px;transform:translateX(-50%);background:#2a2420;color:#f5d27a;font-weight:900;font-size:16px;letter-spacing:3px;padding:3px 16px;border:3px solid #c49a3a;border-radius:4px;white-space:nowrap;box-shadow:0 2px 0 var(--ink)}
.mwrap.ev .mbody{border:3px solid var(--teal);border-top:none;border-radius:0 0 14px 14px}
/* 功能彈窗：卷軸 */
.roller{position:relative;height:24px;margin:0 -10px;border:3px solid var(--ink);border-radius:12px;background:linear-gradient(#e2a15c,#b06a2c 55%,#8a4f1e);z-index:2;display:flex;align-items:center;justify-content:center}
.roller::before,.roller::after{content:'';position:absolute;top:1px;width:14px;height:16px;border-radius:5px;background:#5a3315;border:2px solid var(--ink)}
.roller::before{left:-10px}.roller::after{right:-10px}
.roller .rt{background:var(--teal);color:#fff6d8;font-weight:900;font-size:15px;letter-spacing:3px;padding:2px 16px;border-radius:10px;border:2.5px solid var(--ink);transform:translateY(-12px)}
.roller .rt.ribbon{background:#f08a24}
.mwrap.sc .mbody{border-left:4px solid var(--teal);border-right:4px solid var(--teal);margin:-5px 0}
/* 按鈕 */
.opt{display:block;position:relative;width:100%;min-height:48px;margin:8px 0;padding:9px 12px 9px 14px;border-radius:16px;border:3px solid var(--teal);background:#dff5e4;font-weight:900;font-size:15px;text-align:left;color:var(--ink);box-shadow:0 3px 0 var(--teal)}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--teal)}
.opt:disabled{background:#d7d7d0;border-color:#999;color:#8a8a84;box-shadow:0 3px 0 #999;cursor:not-allowed}
.opt .cost{color:var(--down);font-weight:900;margin-left:4px;white-space:nowrap}
.opt .cost svg{width:18px;height:18px;vertical-align:-4px}
.opt .rate{position:absolute;right:12px;bottom:3px;font-size:11px;color:var(--up)}
.opt .reqt{display:block;font-size:11px;color:#6d6d66;font-weight:700}
.btn{display:block;width:100%;min-height:48px;margin:8px 0;padding:8px 10px;border-radius:24px;border:3px solid var(--ink);background:linear-gradient(#a8f08f,#4cbf45);color:#fff;font-weight:900;font-size:16px;text-shadow:0 1px 0 #2a6a2a;box-shadow:0 4px 0 var(--ink);line-height:1.25}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.mint{background:linear-gradient(#c9f7e0,#7fd9b2);color:var(--teal);text-shadow:none}
.btn.org{background:linear-gradient(#ffa070,#ea6a2e);text-shadow:0 1px 0 #8a3a14}
.btn.lime{background:linear-gradient(#e0ff8a,#9fd63c);color:#2f4a10;text-shadow:none}
.btn:disabled{background:#bdbdb6;color:#f3f3ee;text-shadow:none;box-shadow:0 4px 0 #77776f;cursor:not-allowed}
.btn small{display:block;font-size:11px;font-weight:700}
.btn.sm{display:inline-block;width:auto;min-height:34px;padding:3px 12px;font-size:13px;margin:3px}
.row{display:flex;gap:8px;align-items:center}
.row>.btn{flex:1}
.muted{font-size:12px;color:#5c6b64}
.sec{font-weight:900;color:var(--teal);margin:10px 0 4px;font-size:14px}
.box{background:rgba(255,255,255,.75);border:2.5px solid var(--teal);border-radius:12px;padding:8px 10px;margin:6px 0}

.jobtag{text-align:center;font-size:12px;font-weight:900;color:var(--teal2)}
.center{text-align:center}
.tag{display:inline-block;font-size:11px;font-weight:800;border:2px solid var(--ink);border-radius:8px;padding:0 6px;margin:2px;background:#fff}
.srow{display:grid;grid-template-columns:22px 34px 1fr 30px 30px;gap:4px;align-items:center;font-size:12px;font-weight:900;margin:3px 0}

.dv{font-size:11px}.dv.up{color:var(--up)}.dv.down{color:var(--down)}
.ptop{display:flex;gap:10px;background:linear-gradient(#2f6f55,#235a44);border:3px solid var(--ink);border-radius:14px;padding:8px;color:#fff}

.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.8);border:2.5px solid var(--teal);border-radius:12px;padding:6px 8px;cursor:pointer}
.li .grow{flex:1;min-width:0}
.li b{font-size:13px}
.li svg.sav{width:46px;height:46px;flex:none;border:2px solid var(--ink);border-radius:10px;background:#dcecff}
.li svg.sav.f{background:#ffe1ea}
.li.sel{background:#fff6c8;border-color:#e0a800}
.minis{font-size:10.5px;color:#41514a}
.cards3{display:flex;gap:6px}
.mcard{flex:1;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px;text-align:center;font-size:11px}
.mcard svg{width:70px;height:70px}
.mcard b{font-size:13px;display:block}
.toggle{position:relative;width:54px;height:30px;border-radius:15px;background:#bbb;border:2.5px solid var(--ink);flex:none}
.toggle::after{content:'';position:absolute;left:2px;top:2px;width:21px;height:21px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:.2s}
.toggle.on{background:var(--green)}
.toggle.on::after{left:25px}
.statbox{background:linear-gradient(#2f6f55,#235a44);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;line-height:1.9}
.statbox b{color:#ff6b57;font-size:17px}
.txtin{width:100%;font-size:17px;padding:8px 10px;border:3px solid var(--ink);border-radius:12px;background:#fff}
.fxrow{display:grid;grid-template-columns:22px 34px 1fr 40px;gap:4px;align-items:center;font-size:12px;font-weight:900;margin:4px 0;animation:fadein .5s both}
@keyframes fadein{from{opacity:0;transform:translateX(-8px)}to{opacity:1}}
.fxrow svg{width:20px;height:20px}
.fxtxt{display:inline-block;font-size:13px;font-weight:900;margin:3px 4px;padding:1px 8px;border-radius:8px;border:2px solid;animation:fadein .5s both}
.fxtxt.up{color:var(--up);border-color:var(--up)}.fxtxt.down{color:var(--down);border-color:var(--down)}
.verdict{display:inline-block;font-weight:900;font-size:15px;color:#fff;border:2.5px solid var(--ink);border-radius:8px;padding:0 10px;margin-bottom:4px;transform:rotate(-4deg)}
.verdict.ok{background:var(--up)}.verdict.ng{background:var(--down)}

/* 抓周 */
.zz{position:relative;width:280px;height:280px;margin:6px auto}
.zz .baby{position:absolute;left:95px;top:95px;width:90px;height:90px}
.zz .it{position:absolute;width:66px;height:66px;border-radius:50%;background:#fff;border:3px solid var(--ink);font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--ink)}

/* 紅榜 */
.redlist{background:#c8302a;color:#ffe9b0;border:4px solid #7a1a14;border-radius:6px;padding:10px;text-align:center;transform-origin:top;animation:unroll .9s ease both;box-shadow:inset 0 0 0 3px #e9b44a}
@keyframes unroll{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.redlist h4{font-size:20px;letter-spacing:6px;color:#ffd75e}

.redlist .names .me{color:#fff;background:rgba(255,215,94,.35);font-size:17px}
.stamp{display:inline-block;margin-top:6px;font-size:26px;font-weight:900;border:4px solid;border-radius:8px;padding:0 12px;transform:rotate(-10deg);animation:stamp .5s .9s both}
@keyframes stamp{from{transform:scale(3) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(-10deg);opacity:1}}

/* 跑商 */
.tmap{width:100%;border:3px solid var(--ink);border-radius:10px;display:block}
.tinfo{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin:6px 0}

.chestrow{display:flex;align-items:center;justify-content:space-between;margin-top:10px;background:linear-gradient(#b5824b,#8a5a2b);border:3px solid var(--ink);border-radius:10px;padding:8px}

/* 提示 */
#centertip{position:absolute;left:0;right:0;top:42%;text-align:center;pointer-events:none;z-index:40}

#hints{position:absolute;left:8px;bottom:8px;width:62%;display:flex;flex-direction:column;gap:3px;pointer-events:none;z-index:7}

@keyframes tout{to{opacity:0}}
.moneyfloat{position:absolute;left:70px;top:44px;font-weight:900;font-size:13px;color:var(--up);pointer-events:none;z-index:40;animation:cf 1.1s ease forwards;text-shadow:0 0 3px #fff}

/* ---------- 開場 ---------- */
#intro{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;overflow-y:auto}

.inwrap{padding:30px 20px}
.typer{font-size:17px;line-height:2.1;min-height:300px;padding-top:90px;font-weight:700}
.caret{display:inline-block;width:2px;height:18px;background:#fff;vertical-align:middle;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.gsel{display:flex;gap:8px}
.gsel button{flex:1;height:48px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-size:17px;font-weight:900;box-shadow:0 3px 0 var(--ink)}
.gsel button.on.m{background:#bcdcff}.gsel button.on.f{background:#ffc9d8}
.bigtitle{font-size:34px;font-weight:900;text-align:center;letter-spacing:6px;margin:10px 0;color:#c8402f;text-shadow:3px 3px 0 #fff}

/* ---------- 皇帝模式 ---------- */
#empbar{display:flex;gap:5px;padding:8px 8px 2px;z-index:6;align-items:stretch;overflow-x:auto}
#empbar .ehead{display:flex;align-items:center;gap:3px;background:rgba(255,243,200,.95);border:2.5px solid var(--ink);border-radius:14px;padding:2px 6px 2px 2px;cursor:pointer;flex:1.7;min-width:0}
#empbar .ehead > div{min-width:0;overflow:hidden}
#empbar .ehead .sav{width:34px;height:34px}
#empbar .ehead b{display:block;font-size:13px;white-space:nowrap}

.estat{position:relative;flex:1;min-width:0;background:rgba(255,255,255,.92);border:2.5px solid var(--ink);border-radius:12px;padding:2px 3px 6px;text-align:center;overflow:hidden}
.estat span{display:block;font-size:10px;font-weight:900;color:#666}
.estat b{display:block;font-size:13px;line-height:1.1;white-space:nowrap}
.estat i{position:absolute;left:0;bottom:0;height:4px}
.estat.bad{background:#ffd9cf;animation:pbpulse 1.6s infinite}
#view-court{overflow:hidden;background:linear-gradient(#7a2420,#5a1a16)}
.ecourt{position:absolute;inset:0;overflow-y:auto;padding:8px 8px 20px}
.ebox{background:rgba(250,244,226,.97);border:3px solid var(--ink);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.egrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.budget > div{display:flex;justify-content:space-between;font-size:12px;padding:1px 0}
.budget .up{color:var(--up)} .budget .down{color:var(--down)}
.crisis{display:inline-block;background:#c0392b;color:#fff;font-size:11px;font-weight:900;border-radius:8px;padding:1px 7px;margin:2px 3px 0 0;border:2px solid var(--ink)}
.ftag{display:inline-block;color:#fff;font-size:10px;font-weight:900;border-radius:6px;padding:0 5px;margin-left:3px;vertical-align:1px}
.mingrid{display:grid;grid-template-columns:1fr;gap:6px}
.mincard{display:flex;gap:6px;background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:4px 6px;cursor:pointer}
.mincard .mi{width:46px;height:46px;flex:none}.mincard .mi svg{width:46px;height:46px}
.mstats{display:grid;grid-template-columns:14px 1fr 14px 1fr;gap:1px 4px;align-items:center;font-size:10px;font-weight:900;margin-top:2px}
.mbar{height:6px;background:#e5e0d0;border-radius:3px;overflow:hidden}.mbar i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pchip{display:flex;gap:4px;align-items:center;background:#dcecff;border:2.5px solid #2f5f9e;border-radius:10px;padding:2px 6px 2px 2px;cursor:pointer;min-width:150px;flex:1}
.pchip.f{background:#ffe1ea;border-color:#c24d78}
.pchip.heir{box-shadow:0 0 0 3px #ffd34d}
.pchip .sav{width:36px;height:36px;flex:none}
.pchip b{font-size:12px}.pchip small{display:block;font-size:10px;color:#555}
.echart-wrap{overflow-x:auto;overflow-y:hidden;border:2px dashed #c9b88a;border-radius:10px;background:#fffaf0;margin-top:4px;-webkit-overflow-scrolling:touch}
.echart{position:relative;margin:0 auto}
.echart > svg{position:absolute;left:0;top:0}
.echart path{fill:none;stroke:#6b5444;stroke-width:2.5}
.echart path.dash{stroke-dasharray:6 5;stroke:#8a5a2b}
.echart path.dot{stroke-dasharray:2 5;stroke:#2f6fc0}
.enode{position:absolute;background:#dcecff;border:2.5px solid #2f5f9e;border-radius:10px;text-align:center;cursor:pointer}
.enode.f{background:#ffe1ea;border-color:#c24d78}
.enode.emp{background:#fff1b8;border-color:#c9a23a;box-shadow:0 0 0 3px #ffd34d}
.enode.heir{box-shadow:0 0 0 3px #ffd34d}
.enode .eav{width:30px;height:30px;display:block;margin:1px auto 0}
.enode b{display:block;font-size:10.5px;white-space:nowrap;overflow:hidden}
.enode small{display:block;font-size:9px;color:#555;white-space:nowrap;overflow:hidden}
.enode .exp{position:absolute;right:-8px;bottom:-8px;min-width:22px;height:20px;border-radius:10px;background:#2e7d74;color:#fff;font-size:10px;font-weight:900;line-height:16px;border:2px solid var(--ink);padding:0 3px}
.ecirc{position:absolute;border-radius:50%;border:3px dashed #8a5a2b;background:#f6ead0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.ecirc b{font-size:12px}.ecirc small{font-size:9.5px;color:#555}
.ecirc.old{background:#e0d9cc;border-color:#777}
.ecirc.zong{background:#dbe8fb;border:3px dotted #2f6fc0}
.ecirc.mini{position:static;width:70px;height:70px;font-size:12px;font-weight:900;margin:0 auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;margin-top:4px}
.legend .lg{display:inline-block;width:14px;height:12px;vertical-align:-2px;margin-right:3px}
.lg.box{background:#dcecff;border:2px solid #2f5f9e;border-radius:3px}.lg.circ{background:#f6ead0;border:2px dashed #8a5a2b;border-radius:50%}
.lg.zong{background:#dbe8fb;border:2px dotted #2f6fc0;border-radius:50%}.lg.dash{border-top:2px dashed #8a5a2b;height:0;width:18px}
.emprec{border-bottom:2px dashed #d8c9a0;padding:5px 2px}.emprec.live{background:#fff6d0}
.evrow{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.evpic{width:84px;flex:none;text-align:center;font-size:11px;font-weight:900}
.evpic svg{width:72px;height:72px;display:block;margin:0 auto}
.evpic b,.evpic small{display:block}
.truth{display:inline-block;margin-top:6px;font-size:16px;font-weight:900;border:3px solid;border-radius:8px;padding:0 8px;transform:rotate(-6deg)}
.truth.true{color:#249a3a}.truth.exaggerate{color:#e08a1e}.truth.conceal{color:#7a5cc0}.truth.fabricate{color:#d33a2c}
body.desktop .ecourt{left:50%;right:auto;width:min(1100px,96%);transform:translateX(-50%)}
body.desktop .mingrid{grid-template-columns:1fr 1fr}
body.desktop #empbar{justify-content:center;padding-top:12px}
body.desktop #empbar .ehead{flex:none;max-width:220px}
body.desktop .estat{max-width:120px}

/* ---------- 鍵盤與滑鼠 ---------- */
#pausebadge{position:absolute;left:50%;top:26px;transform:translateX(-50%);z-index:8;background:rgba(240,116,58,.95);color:#fff;font-weight:900;font-size:14px;padding:4px 16px;border-radius:14px;border:2.5px solid var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);animation:pbpulse 1.6s infinite;white-space:nowrap}
@keyframes pbpulse{50%{opacity:.75}}
body.desktop .opt:not(:disabled):hover{background:#c9efd5;transform:translateY(-1px)}
body.desktop .btn:not(:disabled):hover{filter:brightness(1.08);transform:translateY(-1px)}
body.desktop .nbtn:hover{transform:translateY(-3px)}
body.desktop .sicon:hover .ic{transform:scale(1.08)}
body.desktop .pcard:hover{outline:3px solid #ffd34d;outline-offset:2px}
body.desktop .li:hover{border-color:#e0a800}
body.desktop .cal:hover .pg{filter:brightness(1.05)}
body.desktop #btn-speed:hover{filter:brightness(1.08)}
/* 電腦版：選項右上角顯示數字鍵 */
.mbody{counter-reset:opt}
body.desktop .mbody .opt{counter-increment:opt}
body.desktop .mbody .opt::after{content:counter(opt);position:absolute;right:-8px;top:-8px;width:20px;height:20px;border-radius:50%;background:#1f5a55;color:#fff;font-size:11px;font-weight:900;line-height:20px;text-align:center;border:2px solid #fff}
body.desktop .mbody .opt:disabled::after{background:#999}

/* ---------- 結局 ---------- */
.ending{background:radial-gradient(#fff3c0,#f2c14e);border:4px solid #8a5a10;border-radius:14px;padding:14px;text-align:center}
.ending h2{color:#b8301f;font-size:28px;letter-spacing:6px}
.story p{opacity:0;animation:fadein .6s forwards;margin:4px 0;font-size:14px}
.routecard{background:#f6ead0;border:3px solid #8a5a2b;border-radius:12px;padding:10px;margin:8px 0;box-shadow:inset 0 0 0 3px #e9d4a8}
.routecard em{color:#c8302a;font-style:normal;font-weight:900}

<body>
<div id="phone">
  <div id="topbar">
    <div class="res"><span class="ico" id="ic-silver"></span><b id="v-silver">0</b><small id="v-income">+0兩/月</small></div>
    <div class="res"><span class="ico" id="ic-token"></span><b id="v-token">0</b><small id="l-token" style="color:#8a5a2b">家族令</small></div>

      <div class="cal" id="cal" title="點擊暫停／繼續"><div class="rings"><i></i><i></i><i></i></div>

      <path d="M0 220 L0 160 Q60 118 110 160 Q160 124 210 160 Q270 118 330 160 Q365 138 390 152 L390 220Z" fill="#6f9886" opacity=".55"/>

<script>
/* =====================================================================
 *                         【 資 料 區 】
 *  所有遊戲內容都在這裡，日後要擴充只要照格式新增即可。
 *  屬性代號：int 智力 / eq 情商 / str 武力 / hp 健康 / mood 心情
 *  銀兩數字（花費、獎勵）都是「第一代基準值」，遊戲會依家族經濟規模自動放大（見 costScale）
 * ===================================================================== */

const DESKTOP_BASE_HEIGHT = 820;   // 電腦版：視窗高度超過此值時，介面等比放大
const DESKTOP_MAX_SCALE = 1.35;    // 電腦版：介面最大放大倍率
const START_YEAR = 1000;               // 起始年份
const START_SILVER = 300;              // 起始銀兩
const SPEEDS = [1, 1.5, 2, 3, 4, 5];   // 速度檔位（1x = 每秒 1 個月）
const STATS = ['int', 'eq', 'str', 'hp', 'mood'];

    text:'八百里加急：北虜十萬鐵騎叩關，連破三座邊堡，前鋒已逼近長城！朝中主戰主和吵成一片。',

      { text:'召集群臣廷議', win:{ text:'廷議從早吵到晚，陛下必須盡快拿主意……', chain:'border' } } ] },

  { id:'ev_heqin_ask', cat:'邊疆', title:'外邦請和親', cond:{ nat:{ border:[30, 80] } },
    text:'西域諸國遣使來朝，願與天朝結秦晉之好，請以宗室女和親，從此互市通商、永不相犯。',

      { text:'天朝不和親', win:{ text:'使者失望而歸，朝臣稱讚陛下有骨氣。', nat:{ huangquan:3, border:5 } } } ] },

  { id:'ev_peace_talk', cat:'邊疆', title:'議和', cond:{ nat:{ border:[45, 100] } },
    text:'敵國遣使議和，條件是每年歲幣銀十萬兩、絹二十萬匹。主和派說「花錢買太平划算」，主戰派說「喪權辱國」。',
    options:[

  { id:'ev_campaign', cat:'邊疆', title:'親征之議', major:true, cond:{ nat:{ border:[50, 100] } },

      { text:'御駕親征', check:{ nat:'bingli', base:45 },

      { text:'派大將出征', check:{ nat:'bingli', base:50 },

  { id:'ev_general_power', cat:'邊疆', title:'武將擁兵', actor:'minister:wujiang', cond:{ needs:['minister:wujiang'] },

  { id:'ev_victory', cat:'邊疆', title:'邊將大捷', cond:{ nat:{ bingli:[55, 100] } },

  { id:'ev_flood', cat:'天災', title:'大水', weight:8, cond:{}, flood:true,

  { id:'ev_locust', cat:'天災', title:'蝗災', weight:6, cond:{},

  { id:'ev_zuiji', cat:'天象', title:'罪己詔', major:true, cond:{},

  { id:'ev_x_potato', cat:'穿越', title:'番薯詩', founderOnly:true, once:true, cond:{},

// ── 人物頭像 ──
// 嬰兒光頭、孩童、書生、官帽、員外帽（錢莊）、武人、郎中、農夫、白髮老人
function avatarSVG(p, cls) {
  const age = ageOf(p), f = p.gender === 'f', elder = age >= 60;
  const hair = elder ? '#ecebe6' : '#2b2420', skin = '#ffe0c2';
  const c = cls ? ` class="${cls}${f ? ' f' : ''}"` : '';
  let s = `<svg viewBox="0 0 100 100"${c}>`;
  if (age < 2) {   // 嬰兒：光頭、圍兜
    s += `<path d="M22 100 Q20 76 50 72 Q80 76 78 100Z" fill="#f6d27a" ${SW}/><circle cx="50" cy="50" r="25" fill="${skin}" ${SW}/>`;
    s += `<path d="M47 27 Q50 20 55 25" fill="none" ${SW}/>` + face(50, 52, 0.85) + `</svg>`;
    return s;
  }
  const line = (typeof isEmperor === 'function' && isEmperor(p)) ? 'emperor' : p.job;   // 帝王模式：皇帝戴冕冠
  let cloth = f ? '#e57aa0' : '#6f9fd8';
  if (age < 16) cloth = '#f0a040';
  else if (line === 'emperor') cloth = '#e8b820';
  else if (line === 'official') cloth = '#c0392b';
  else if (line === 'martial') cloth = '#5d6a76';
  else if (line === 'army') cloth = '#8d99a6';
  else if (line === 'merchant') cloth = '#b5772f';
  else if (line === 'bank') cloth = '#9a6233';
  else if (line === 'academy' || line === 'student') cloth = '#4a7fb5';
  else if (line === 'clinic') cloth = '#e9e4d8';
  else if (line === 'farm') cloth = '#7a9a4a';
  s += `<path d="M14 100 Q16 72 50 69 Q84 72 86 100Z" fill="${cloth}" ${SW}/>`;
  s += `<path d="M40 71 L50 84 L60 71" fill="#fff" ${SW}/>`;
  const hatted = age >= 16 && (line === 'official' || line === 'martial' || line === 'clinic' || line === 'army' || line === 'emperor');
  if (f) {
    // 交領衣襟：淡色內襟＋腰帶
    s += `<path d="M38 71 L50 88 L62 71" fill="#fff6f0" ${SW2}/><path d="M18 92 Q50 86 82 92" fill="none" stroke="#fff0c0" stroke-width="4"/>`;
    // 髮髻（成年女子、沒戴官帽時）：髮髻、金簪、小花
    if (age >= 16 && !hatted) s += `<ellipse cx="50" cy="17" rx="13" ry="10" fill="${hair}" ${SW}/>` +
      (elder ? `<path d="M36 17 L66 13" stroke="#c9a23a" stroke-width="3" stroke-linecap="round"/>` :
       `<path d="M33 21 L69 11" stroke="#e8b84a" stroke-width="3" stroke-linecap="round"/><circle cx="69" cy="11" r="2.6" fill="#e8b84a" ${SW2}/>` +
       [[0, -3.4], [3.2, -1], [2, 2.8], [-2, 2.8], [-3.2, -1]].map(([dx, dy]) => `<circle cx="${36 + dx}" cy="${14 + dy}" r="2.6" fill="#ff8fb1"/>`).join('') + `<circle cx="36" cy="14" r="1.6" fill="#ffe27a"/>`);
  }
  s += `<circle cx="50" cy="46" r="24" fill="${skin}" ${SW}/>`;
  if (f) {
    // 兩側垂髮落在肩上（長大才有；長者盤髮、沒有垂髮）
    if (age >= 10 && !elder) s += `<path d="M27 40 Q19 62 23 84 Q29 88 34 82 Q29 64 33 50Z" fill="${hair}" ${SW}/><path d="M73 40 Q81 62 77 84 Q71 88 66 82 Q71 64 67 50Z" fill="${hair}" ${SW}/>`;
    // 斜瀏海
    s += `<path d="M26 46 Q25 21 50 20 Q75 21 74 46 Q71 33 61 30 Q57 37 47 36 Q40 31 34 34 Q28 38 26 46Z" fill="${hair}" ${SW}/>`;
  }
  else s += `<path d="M27 42 Q28 21 50 21 Q72 21 73 42 Q66 32 56 34 L50 28 L44 34 Q34 32 27 42Z" fill="${hair}" ${SW}/>`;
  if (age < 16) s += `<circle cx="32" cy="24" r="8" fill="${hair}" ${SW}/><circle cx="68" cy="24" r="8" fill="${hair}" ${SW}/>`;
  else if (!f || hatted) s += hatSVG(line);
  s += f ? faceF(50, 48, age < 16) : face(50, 48, 1);
  if (elder) {
    if (!f) s += `<path d="M38 60 Q50 84 62 60 Q56 66 50 64 Q44 66 38 60Z" fill="${hair}" ${SW}/>`;
    s += f ? `<path d="M33 52 Q35 55 33 58 M67 52 Q65 55 67 58" fill="none" stroke="#d9a88a" stroke-width="1.6"/>` : `<path d="M34 40 L40 42 M66 40 L60 42" stroke="#b08a70" stroke-width="2"/>`;
  }
  return s + `</svg>`;
}
function faceF(cx, cy, child) {
  const e = 8.5;
  let s = `<path d="M${cx - e - 4} ${cy - 7} Q${cx - e} ${cy - 9} ${cx - e + 4} ${cy - 7.5} M${cx + e - 4} ${cy - 7.5} Q${cx + e} ${cy - 9} ${cx + e + 4} ${cy - 7}" fill="none" stroke="#5a4032" stroke-width="1.4" stroke-linecap="round"/>`;
  for (const d of [-1, 1]) {
    const x = cx + d * e;
    s += `<ellipse cx="${x}" cy="${cy}" rx="2.9" ry="3.5" fill="${INK}"/><circle cx="${x + 1}" cy="${cy - 1.3}" r="1.1" fill="#fff"/>`;
    if (!child) s += `<path d="M${x + d * 2.6} ${cy - 2.4} L${x + d * 4.8} ${cy - 4.2}" stroke="${INK}" stroke-width="1.4" stroke-linecap="round"/>`;
    s += `<ellipse cx="${x + d * 3.5}" cy="${cy + 6.5}" rx="4.2" ry="2.4" fill="#ff9eb4" opacity=".65"/>`;
  }
  s += `<path d="M${cx - 3.2} ${cy + 8.2} Q${cx} ${cy + 11} ${cx + 3.2} ${cy + 8.2}" fill="#e2566f" stroke="#c2405a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>`;
  return s;
}
function face(cx, cy, k) {
  const e = 9 * k;
  return `<circle cx="${cx - e}" cy="${cy}" r="${2.8 * k}" fill="${INK}"/><circle cx="${cx + e}" cy="${cy}" r="${2.8 * k}" fill="${INK}"/>` +
    `<ellipse cx="${cx - e - 4}" cy="${cy + 7 * k}" rx="${4 * k}" ry="${2.4 * k}" fill="#ff9e9e" opacity=".7"/><ellipse cx="${cx + e + 4}" cy="${cy + 7 * k}" rx="${4 * k}" ry="${2.4 * k}" fill="#ff9e9e" opacity=".7"/>` +
    `<path d="M${cx - 4 * k} ${cy + 8 * k} Q${cx} ${cy + 12 * k} ${cx + 4 * k} ${cy + 8 * k}" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`;
}
function hatSVG(line) {

function fmt(n) {
  const a = Math.abs(n), sg = n < 0 ? '-' : '';
  if (a >= 1e16) return sg + (a / 1e16).toFixed(2) + '京';
  if (a >= 1e12) return sg + (a / 1e12).toFixed(2) + '兆';
  if (a >= 1e8) return sg + (a / 1e8).toFixed(2) + '億';
  if (a >= 1e4) return sg + (a / 1e4).toFixed(2) + '萬';
  return sg + a.toFixed(1);
}
const fmtS = n => (n >= 0 ? '+' : '') + fmt(n);

/* ---------- 人物查詢 ---------- */
const P = id => G.people[id];

// 帝王模式：已分封、出降、和親的人（p.out）不再逐人模擬
const livingMembers = () => LIVE || (LIVE = Object.values(G.people).filter(p => p.alive && !p.out));
const spouseOf = p => p.spouseId ? P(p.spouseId) : null;
const isMarried = p => { const s = spouseOf(p); return !!(s && s.alive); };
const capOf = p => APTITUDES[p.apt].cap;

const isTop = p => p.job && p.job !== 'student' && p.rank === JOB_LINES[p.job].ranks.length - 1;
function aliveGenerations() { return new Set(livingMembers().map(p => p.gen)).size; }
// 官職全名：例如「正三品 六部侍郎」
const offName = r => JOB_LINES.official.grades[r] + ' ' + JOB_LINES.official.ranks[r];
// 帝王模式下的皇族稱號
function imperialTitle(p) {
  if (!isEmp() || !p.alive) return '';
  return empTitle(p);   // 帝王模式的稱號在 4b 區塊
  const e = head();
  if (p.id === G.headId) return G.emp.dynasty + '皇帝';
  if (e && p.id === e.spouseId) return '皇后';
  if (p.id === G.heirId) return '太子';
  if (e && e.children.includes(p.id) && !p.job) return p.gender === 'm' ? '皇子' : '公主';
  return '';
}
function jobTitle(p) {
  if (!p.alive) return '已故';
  const it = imperialTitle(p); if (it) return it;
  const a = ageOf(p);
  if (!p.job) return a < 2 ? '嬰孩' : a < 16 ? '孩童' : '無業';
  const L = JOB_LINES[p.job];
  if (p.job === 'official') return `${L.grades[p.rank]} ${L.ranks[p.rank]}`;

}

function collBonus(k) { let s = 0; for (const id in G.collection) { const c = COLLECTIBLES.find(x => x.id === id); if (c && c.bonus[k]) s += c.bonus[k] * G.collection[id]; } return s; }
const equippedHeir = () => HEIRLOOMS.find(h => h.id === G.equipped);
function heirMod(k) { const h = equippedHeir(); return h && h.mods[k] ? h.mods[k] : 0; }
// 有效屬性 = 基礎 + 藏品 + 傳家寶（家主）
function eff(p, k) {
  let v = p.stats[k];
  if (k !== 'hp') v += collBonus(k);
  const h = equippedHeir(); if (h && p.id === G.headId && h.stats[k] && k !== 'hp') v += h.stats[k];
  return Math.round(clamp(v, 0, 120));
}
function chanceOf(p, check) {
  return Math.round(clamp(check.base + (eff(p, check.stat) - 50) * 0.8 + (eff(p, 'mood') - 50) * 0.2, 5, 95));
}
// 門檻：全族任一在世成員符合
function reqMet(req) { if (!req) return true; return Object.keys(req).every(k => livingMembers().some(p => eff(p, k) > req[k])); }
const reqText = req => '（需家族成員有人' + Object.keys(req).map(k => STAT_NAME[k] + '>' + req[k]).join('、') + '）';

/* ---------- 經濟 ---------- */
// 時代倍率：每 30 年物價 ×1.5
const eraMul = () => Math.pow(1.5, (G.year - START_YEAR) / 30);
// 家主加成：家主的智力與情商提升全族收入
const headMul = () => { const h = head(); return h && h.alive ? 1 + (eff(h, 'int') + eff(h, 'eq')) / 400 : 1; };
// 事件、跑商等銀兩的「經濟規模」縮放（第一代為 1）
const costScale = () => Math.max(1, Math.pow(Math.max(1, G.lastGross) / 40, 0.85));
const scaled = v => Math.round(v * costScale() * 10) / 10;
function lineStatAvg(p) { const L = jobLine(p); return L.stats.reduce((s, k) => s + eff(p, k), 0) / L.stats.length; }
function salaryOf(p) {
  if (!p.alive || !p.job || p.trading) return 0;
  const L = jobLine(p);
  return L.salary[p.rank] * (1 + lineStatAvg(p) / 200) * eraMul() * headMul() * (1 + collBonus('salary') + heirMod('salary'));
}
function livingCost(p) {
  const n = livingMembers().length;
  return (ageOf(p) < 16 ? LIVING_COST.child : LIVING_COST.adult) * (1 + n / 25) * eraMul();
}
const personNet = p => p.alive && !isEmp() ? salaryOf(p) - livingCost(p) : 0;   // 帝王模式不計個人收支
const fameMul = () => 1 + Math.min(G.fame, 3000) / 3000;
const clerkMul = () => 1 + 0.06 * (G.servants.clerk || 0);
const guardReduce = () => Math.min(0.8, 0.12 * (G.servants.guard || 0) + (livingMembers().some(p => p.job === 'army' && p.rank >= 2) ? ARMY_GUARD : 0));
const butlerReduce = () => Math.min(0.5, 0.08 * (G.servants.butler || 0));
function boostMul(id) { let m = 1; for (const b of G.boosts) if (b.types === 'all' || (Array.isArray(b.types) && b.types.includes(id))) m *= b.mul; return m; }
function managerMul(bs) {
  if (bs.manager === 'butler') return 1.1;
  const p = bs.manager && P(bs.manager);
  if (!p || !p.alive) return 0.8;
  return 0.8 + (eff(p, 'eq') + eff(p, 'int')) / 200 * 0.8;
}
function buildingIncome(id, lvOverride) {
  const b = BUILDINGS.find(x => x.id === id), bs = G.buildings[id];
  if (b.kind !== 'shop') return 0;
  const lv = lvOverride || (bs ? bs.lv : 1);
  if (!lvOverride && (!bs || bs.closed > 0)) return 0;
  let v = b.income * Math.pow(LEVEL_INCOME_MUL, lv - 1) * (bs ? managerMul(bs) : 0.8);
  v *= fameMul() * clerkMul() * boostMul(id) * headMul() * eraMul() * (1 + collBonus('income') + heirMod('income'));
  if (id === 'tavern') v *= 1 + Math.min(G.fame, 3000) / 1500;   // 酒樓特別吃名聲
  return v;
}
function popCap() { let c = 0; for (const b of BUILDINGS) if (b.kind === 'home' && G.buildings[b.id]) c += b.cap + 2 * (G.buildings[b.id].lv - 1); return c; }
function homeMood() { let m = 0; for (const b of BUILDINGS) if (b.kind === 'home' && G.buildings[b.id]) m += b.mood * G.buildings[b.id].lv; return m; }
const upgradeCost = (b, lv) => Math.max(300, b.price) * Math.pow(UPGRADE_COST_MUL, lv);
const servantWage = () => SERVANTS.reduce((s, x) => s + x.wage * (G.servants[x.id] || 0), 0) * eraMul();
function calcEconomy() {
  let persons = 0; for (const p of livingMembers()) persons += personNet(p);
  let shops = 0; for (const b of BUILDINGS) if (G.buildings[b.id]) shops += buildingIncome(b.id);
  const wages = servantWage();
  let gross = shops; for (const p of livingMembers()) gross += salaryOf(p);
  return { persons, shops, wages, gross, net:persons + shops - wages };
}
function ownedShops() { return BUILDINGS.filter(b => b.kind === 'shop' && G.buildings[b.id]).map(b => b.id); }
function playerAssets() { let v = G.silver; for (const id in G.buildings) v += G.buildings[id].invested || 0; return v; }

/* ---------- 建立人物 ---------- */
const randomGiven = g => { const pool = g === 'm' ? MALE_CHARS : FEMALE_CHARS; return pick(pool) + (Math.random() < 0.8 ? pick(pool) : ''); };
function randomFullName(g, avoid) { let s; do { s = pick(SURNAMES); } while (s === avoid); return s + randomGiven(g); }
function makePerson(o) {
  const id = G.nextId++;
  const p = { id, name:o.name, gender:o.gender, by:o.by, bm:o.bm || G.month, alive:true, dy:null, blood:o.blood !== false, gen:o.gen || 1,
    founder:!!o.founder, tag:o.tag || '', fatherId:o.fatherId || null, motherId:o.motherId || null, spouseId:null, children:[],

function plog(p, t) { p.logs.push({ y:G.year, m:G.month, t }); if (p.logs.length > 60) p.logs.shift(); }
function flog(t) { G.chronicle.unshift({ y:G.year, m:G.month, t }); if (G.chronicle.length > 100) G.chronicle.pop(); }
function randStats(base, spread) { const s = {}; for (const k of STATS) s[k] = clamp(base + randi(-spread, spread), 5, 95); return s; }

/* ---------- 新遊戲 ---------- */
function newGame(o) {
  LIVE = null;
  G = { ver:2, year:START_YEAR, month:1, silver:START_SILVER, tokens:3, gold:0, fame:0,
    speed:1, paused:false, autoSmall:false, music:60, sfx:60,
    surname:o.surname, people:{}, nextId:1, headId:null, rootId:null, heirId:null,

    stats:{ topJobs:0, tops:{}, zhuangyuan:0, jinshi:0, maxOfficial:-1, mengzhu:0, maxAge:0, heads:1, totalMembers:0 } };
  // 依出身決定起始銀兩、屬性、職業；開局孤身一人

  for (const k in og.stats) stats[k] = clamp(stats[k] + og.stats[k], 5, 95);
  const me = makePerson({ name:o.surname + o.given, gender:o.gender, by:START_YEAR - START_AGE, stats, apt:og.apt, founder:true, job:og.job, rank:0, prof:0 });
  me.tag = og.name + '出身';
  G.headId = G.rootId = me.id;
  G.headsHist.push({ id:me.id, name:me.name, from:START_YEAR });
  plog(me, `從現代穿越而來，成了${og.name}出身的孤身少年`);
  if (og.job) plog(me, `${START_YEAR}年 進入${JOB_LINES[og.job].place}當${JOB_LINES[og.job].ranks[0]}`);
  // 開局幾個月內，媒婆一定會上門一次

  flog(`${me.name}穿越到${START_YEAR}年，${G.surname}氏一族由此開始`);

}

/* ---------- 存檔 ---------- */
function save() { if (!G) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

/* ---------- 效果套用 ---------- */
// out：顯示用的變化清單 [{k:屬性, v}] 或 {t:文字, v} 或 {money:v}
function applyFx(fx, p, out) {
  out = out || [];
  if (!fx) return out;
  const soften = v => v < 0 ? v * (1 - butlerReduce()) : v;   // 管家減少負面影響
  for (const k in fx) {
    const v = fx[k];
    if (STATS.includes(k)) {
      const before = p.stats[k];
      const cap = (k === 'hp' || k === 'mood') ? 100 : Math.max(capOf(p), before);
      p.stats[k] = clamp(Math.round(before + soften(v)), 0, cap);
      const d = p.stats[k] - before;
      p.delta[k] = d;
      out.push({ k, v:d, p });
    } else if (k === 'silver') {
      let amt = scaled(v);
      if (amt < 0 && fx.guard) amt *= 1 - guardReduce();
      amt = soften(amt);
      G.silver += amt; if (amt > 0) G.totalEarned += amt;
      out.push({ money:amt });
    } else if (k === 'prof') {
      if (p.job && p.job !== 'student') { const b = p.prof; p.prof = clamp(p.prof + soften(v), 0, 100); out.push({ t:'熟練度', v:Math.round(p.prof - b) }); checkPromote(p, out); }
    } else if (k === 'fame') { const d = Math.round(soften(v)); G.fame = Math.max(0, G.fame + d); out.push({ t:'家族名聲', v:d }); }
    else if (k === 'tokens') { G.tokens += v; out.push({ t:'家族令', v }); }
    else if (k === 'gold') { G.gold += v; out.push({ t:'金條', v }); }
    else if (k === 'life') { p.life += v; out.push({ t:'壽命', v }); }
    else if (k === 'item') { const r = gachaGive(v); out.push({ t:`獲得${r.c.q}「${r.c.name}」`, v:1 }); }
    else if (k === 'heir') { if (!G.heirlooms.includes(v)) { G.heirlooms.push(v); if (!G.equipped) G.equipped = v; out.push({ t:'傳家寶「' + HEIRLOOMS.find(h => h.id === v).name + '」', v:1 }); } else { G.gold++; out.push({ t:'金條', v:1 }); } }
    else if (k === 'rank') changeOfficialRank(p, v, out);
    else if (k === 'fire') fireOfficial(p, out);
    else if (k === 'all') { for (const m of livingMembers()) applyFx(v, m); for (const s in v) out.push({ t:'全族' + STAT_NAME[s], v:v[s] }); }
    else if (k === 'close') closeBuildings(v, out);
    else if (k === 'boost') addBoost(v, out);
    else if (k === 'openMatch') G._openMatch = p.id;
    else if (k === 'marry') { const s = eventMarry(p, v); if (s) out.push({ t:`與${s.name}成親`, v:1 }); }
  }
  return out;
}
function closeBuildings(c, out) {
  let ids = c.types === 'all' ? ownedShops() : c.types === 'random' ? [pick(ownedShops())].filter(Boolean) : c.types.filter(t => G.buildings[t]);
  for (const id of ids) G.buildings[id].closed = Math.max(G.buildings[id].closed, c.months);
  if (ids.length && out) out.push({ t:ids.map(id => BUILDINGS.find(b => b.id === id).name).join('、') + '停業' + c.months + '月', v:-1 });
}
function addBoost(b, out) {
  G.boosts.push({ types:b.types, months:b.months, mul:b.mul });
  if (out) out.push({ t:(b.types === 'all' ? '全產業' : b.types.map(id => BUILDINGS.find(x => x.id === id).name).join('、')) + '收益×' + b.mul, v:b.mul >= 1 ? 1 : -1 });
}

/* ---------- 職業 ---------- */
function setJob(p, line) {
  const was = p.job;
  p.job = line; p.rank = 0; p.prof = 0;
  if (was === 'official') { p.title = p.title || ''; }
  plog(p, `${G.year}年 進入${JOB_LINES[line].place}當${JOB_LINES[line].ranks[0]}`);
}
// 熟練度滿了就升遷（官場除外，官場靠考核）
function checkPromote(p, out) {
  if (!p.job || p.job === 'official' || p.job === 'student') return;
  const L = jobLine(p);
  while (p.prof >= 100 && p.rank < L.ranks.length - 1) {
    p.rank++; p.prof = 0;
    plog(p, `${G.year}年 升任${L.ranks[p.rank]}`);
    if (out) out.push({ t:'升任' + L.ranks[p.rank], v:1 });
    if (isTop(p)) reachTop(p);
    else hint(`🎉 ${p.name}升任${L.place}${L.ranks[p.rank]}`);
  }
  if (isTop(p)) p.prof = Math.min(p.prof, 100);
}
function reachTop(p) {
  G.stats.topJobs++;
  G.stats.tops[p.job] = (G.stats.tops[p.job] || 0) + 1;
  G.fame += 30;
  flog(`${p.name}成為${jobTitle(p)}，達到頂級職業！`);
  centerTip(`${p.name}達到頂級職業「${JOB_LINES[p.job].ranks[p.rank]}」！`);
  if (!G.unlocked) { G.unlocked = true; setTimeout(() => onUnlock(), 1500); }
}
function changeOfficialRank(p, d, out) {
  if (p.job !== 'official') return;
  const nr = p.rank + d;
  if (nr < 0) return fireOfficial(p, out);
  const L = JOB_LINES.official;
  p.rank = Math.min(L.ranks.length - 1, nr); p.prof = 0;
  G.stats.maxOfficial = Math.max(G.stats.maxOfficial, p.rank);
  plog(p, `${G.year}年 ${d > 0 ? '升任' : '貶為'}${offName(p.rank)}`);
  if (out) out.push({ t:(d > 0 ? '升任' : '貶為') + offName(p.rank), v:d });
  if (d > 0 && isTop(p)) reachTop(p);
}
function fireOfficial(p, out) {
  if (p.job !== 'official') return;
  plog(p, `${G.year}年 被罷官`);
  if (out) out.push({ t:'罷官', v:-1 });
  p.job = null; p.rank = 0; p.prof = 0;
}

/* ---------- 事件 ---------- */
function memberOK(p, c) {
  if (!p || !p.alive || p.trading) return false;
  const a = ageOf(p);
  if (c.age && (a < c.age[0] || a > c.age[1])) return false;
  if (!c.age && a < 16) return false;
  if (c.gender && p.gender !== c.gender) return false;
  if (c.job && !c.job.includes(p.job)) return false;
  if (c.rank !== undefined && p.rank < c.rank) return false;
  if (c.maxRank !== undefined && p.rank > c.maxRank) return false;
  if (c.prof !== undefined && p.prof < c.prof) return false;
  if (c.married !== undefined && isMarried(p) !== c.married) return false;
  if (c.stats) for (const k in c.stats) if (eff(p, k) < c.stats[k]) return false;
  if (c.kids && p.children.length < c.kids) return false;
  return true;
}
function eventTargets(e) {
  const c = e.cond || {};
  if (c.target === 'family') return head() && head().alive ? [head()] : [];
  if (c.target === 'founder') { const f = P(G.rootId); return memberOK(f, c) ? [f] : []; }   // 穿越者本人（仍檢查年齡等條件）
  return livingMembers().filter(p => memberOK(p, c));
}
function pickEvent() {
  const now = monthIndex(), cands = [];
  const busy = new Set(Q.filter(x => x.pid).map(x => x.pid));
  for (const e of EVENTS) {
    const last = G.seen[e.id];
    if (!e.perPerson && last !== undefined && (e.once || now - last < 30)) continue;
    if (isEmp() && e.cond && e.cond.target === 'family') continue;   // 帝王模式：天下大事改由朝政奏摺處理
    let ts = eventTargets(e).filter(p => !busy.has(p.id));
    if (e.perPerson) ts = ts.filter(p => { const t = (G.seenP || {})[e.id + ':' + p.id]; return t === undefined || now - t >= PER_PERSON_COOLDOWN; });
    if (ts.length) cands.push({ e, ts });
  }
  if (!cands.length) return null;
  const c = wpick(cands, x => x.e.weight || 10);
  return { e:c.e, p:pick(c.ts) };
}
function tpl(s, p) {
  const sp = p && spouseOf(p);
  return s.replace(/\{name\}/g, p ? p.name : '').replace(/\{surname\}/g, G.surname).replace(/\{spouse\}/g, sp ? sp.name : '另一半')
          .replace(/\{opp\}/g, p && p.gender === 'f' ? '公子' : '姑娘').replace(/\{age\}/g, p ? ageOf(p) : '').replace(/\{job\}/g, p ? jobTitle(p) : '');
}
const optCost = o => o.cost ? scaled(o.cost) : 0;
const optOK = o => (!o.cost || G.silver >= optCost(o)) && reqMet(o.req);
// 小事件：沒有花費、沒有門檻、不是重大事件
const isSmallEvent = e => !e.major && e.options.every(o => !o.cost && !o.req);
function resolveOption(e, p, oi) {
  const o = e.options[oi];
  const out = [];
  const before = G.silver;
  if (o.cost) G.silver -= optCost(o);
  let ok = true, res = o.win;
  if (o.check) { ok = Math.random() * 100 < chanceOf(p, o.check); res = ok ? o.win : (o.lose || { text:'事與願違。', fx:{} }); }
  p.delta = {};
  applyFx(res.fx, p, out);
  const text = tpl(res.text, p);
  plog(p, `${G.year}年【${e.title}】${text}`);
  checkDeaths();
  return { ok, checked:!!o.check, text, out, silverBefore:before, silverAfter:G.silver };
}
function autoOption(e, p) {
  let best = 0, bv = -1;
  e.options.forEach((o, i) => { if (!optOK(o)) return; const v = o.check ? chanceOf(p, o.check) : 60; if (v > bv) { bv = v; best = i; } });
  return best;
}

/* ---------- 出生與抓周 ---------- */
function births() {
  const n = livingMembers().length, cap = popCap();
  const crowd = n >= cap ? CROWD_BIRTH_MUL * Math.pow(cap / n, 4) : 1;
  for (const p of livingMembers().filter(x => x.blood)) {
    const s = spouseOf(p);
    if (!s || !s.alive || p.children.length >= 6 || p.trading || s.trading) continue;
    const wife = p.gender === 'f' ? p : s, wa = ageOf(wife);
    if (wa < 16 || wa > 45) continue;
    const ch = 0.028 * (wa <= 28 ? 1 : (46 - wa) / 18) * (1 + 0.15 * (G.servants.nanny || 0)) * crowd;
    if (Math.random() < ch) bear(p, s);
  }
}
function bear(p, s, silent) {
  const g = Math.random() < 0.5 ? 'm' : 'f';
  const avg = k => (p.stats[k] + s.stats[k]) / 2;
  const pav = (avg('int') + avg('eq') + avg('str')) / 3;
  const score = pav * 0.6 + rand(0, 45);
  const apt = score < 35 ? 0 : score < 52 ? 1 : score < 66 ? 2 : 3;
  const stats = {};
  for (const k of STATS) stats[k] = k === 'hp' ? randi(70, 92) : k === 'mood' ? randi(55, 75) : clamp(Math.round(randi(4, 12) + avg(k) * 0.12), 1, 35);
  const father = p.gender === 'm' ? p : s, mother = p.gender === 'f' ? p : s;
  const c = makePerson({ name:G.surname + randomGiven(g), gender:g, by:G.year, stats, apt, gen:(p.blood ? p.gen : s.gen) + 1, fatherId:father.id, motherId:mother.id });
  p.children.push(c.id); s.children.push(c.id);
  plog(c, `${G.year}年 出生，資質「${APTITUDES[apt].name}」`);
  plog(p, `${G.year}年 喜得${g === 'm' ? '麟兒' : '千金'}${c.name}`);
  flog(`${p.name}與${s.name}喜得${g === 'm' ? '一子' : '一女'}${c.name}`);
  G.justBorn = c.id;
  enqueue({ type:'zhuazhou', pid:c.id });
  if (!silent) hint(`👶 ${p.name}家喜得${g === 'm' ? '麟兒' : '千金'}「${c.name}」`);
  return c;
}
function doZhuazhou(p, it) {
  p.talent = it.id;
  for (const k in it.grow) p.stats[k] = clamp(p.stats[k] + it.grow[k] * 2, 0, capOf(p));
  plog(p, `抓周抓到「${it.name}」：${it.desc}`);
}
// 收養／投靠：以家主子女身分加入族譜
function adoptPerson(o) {
  const h = head();
  const p = makePerson({ name:o.name, gender:o.gender, by:G.year - o.age, stats:o.stats, apt:o.apt, gen:h.gen + 1, tag:o.tag, fatherId:h.gender === 'm' ? h.id : null, motherId:h.gender === 'f' ? h.id : null });
  h.children.push(p.id);
  const sp = spouseOf(h); if (sp) sp.children.push(p.id);
  plog(p, `${G.year}年 以${o.tag}身分加入${G.surname}家`);
  flog(`${p.name}以${o.tag}身分加入${G.surname}家`);
  G.justBorn = p.id;
  if (o.age === 0) enqueue({ type:'zhuazhou', pid:p.id });
  return p;
}

/* ---------- 死亡與傳承 ---------- */
function checkDeaths() {
  for (const p of livingMembers()) {
    if (p.stats.hp <= 0) die(p, ageOf(p) < 50 ? '積勞成疾，英年早逝' : '病重不治');
    else if (ageOf(p) >= p.life) die(p, '壽終正寢');
  }
}
function die(p, cause) {
  if (!p.alive) return;
  p.alive = false; p.dy = G.year; p.deathCause = cause; LIVE = null;
  G.stats.maxAge = Math.max(G.stats.maxAge, ageOf(p));
  plog(p, `${G.year}年 ${cause}，享年${ageOf(p)}歲`);
  flog(`${p.name}${cause}，享年${ageOf(p)}歲`);
  for (const id in G.buildings) if (G.buildings[id].manager === p.id) G.buildings[id].manager = null;
  if (G.trade && G.trade.members.includes(p.id)) G.trade.members = G.trade.members.filter(x => x !== p.id);
  if (G.heirId === p.id) G.heirId = null;
  if (G.mengzhuId === p.id) G.mengzhuId = null;
  for (let i = Q.length - 1; i >= 0; i--) if (Q[i].pid === p.id && Q[i].type !== 'succession' && Q[i].type !== 'esucc') Q.splice(i, 1);
  if (p.id === G.headId) enqueue(isEmp() ? { type:'esucc', pid:p.id, reason:G.emp.pendingEnding || 'natural' } : { type:'succession', pid:p.id });
  else hint(`🕯 ${p.name}${cause}，享年${ageOf(p)}歲`);
  if (!livingMembers().length && !isEmp()) gameOver();
}
function heirCandidates() {
  const all = livingMembers();
  // 帝王模式：太子優先，其次是先帝的子女（父死子繼），再來才是其他宗室
  const dead = head(), isKid = p => isEmp() && dead && dead.children.includes(p.id);
  const adults = all.filter(p => ageOf(p) >= 16).sort((a, b) => (b.id === G.heirId) - (a.id === G.heirId) || isKid(b) - isKid(a) || b.blood - a.blood || a.gen - b.gen || ageOf(b) - ageOf(a));
  return { adults, minors:all.filter(p => ageOf(p) < 16).sort((a, b) => ageOf(b) - ageOf(a)) };
}
function bestJob(p) {
  if (p.mengzhu) return '武林盟主';
  if (p.job) return jobTitle(p).replace('已故', '');
  const last = [...p.logs].reverse().find(l => /升任|進入|當/.test(l.t));
  return last ? last.t.replace(/^\d+年 /, '') : '布衣';
}
function lifeTitle(p) {
  if (p.job === 'official' && p.rank === PREMIER_RANK) return '一代名相';
  if (p.job === 'official' && p.rank >= TAIFU_RANK) return '位列三公';
  if (p.job === 'official' && p.rank >= 10) return '封疆大吏';
  if (p.title === '狀元') return '狀元及第';
  if (p.mengzhu) return '武林至尊';
  if (p.job === 'army' && isTop(p)) return '威震八方';
  if (p.job === 'merchant' && isTop(p)) return '富甲天下';
  if (p.job === 'bank' && isTop(p)) return '富甲一方';
  if (p.job === 'clinic' && isTop(p)) return '妙手回春';
  if (p.job === 'academy' && isTop(p)) return '桃李天下';
  if (p.job === 'martial' && isTop(p)) return '一代宗師';
  if (p.job === 'farm' && isTop(p)) return '良田千頃';
  if (ageOf(p) >= 90) return '壽比南山';
  if (p.children.length >= 6) return '多子多福';
  if (ageOf(p) < 30) return '英年早逝';
  return '平凡一生';
}
function succeed(newId) {
  const fee = Math.max(30, G.silver * 0.05 + scaled(100));   // 喪葬費
  G.silver -= fee;
  const last = G.headsHist[G.headsHist.length - 1]; if (last) last.to = G.year;
  G.headId = newId; G.heirId = null;
  G.stats.heads++;
  const n = head();
  G.headsHist.push({ id:n.id, name:n.name, from:G.year });
  plog(n, `${G.year}年 繼任${G.surname}氏第${G.stats.heads}任家主`);
  flog(`${n.name}繼任第${G.stats.heads}任家主`);
  if (isEmp()) onNewEmperor();      // 帝王模式：新君登基、改元
  save();
  return fee;
}
function gameOver() { if (G.over) return; G.over = true; flog(`${G.surname}氏一族血脈斷絕`); enqueue({ type:'gameover' }); save(); }

/* ---------- 每年 ---------- */
function yearTick() {
  const hm = homeMood() + heirMod('mood') + collBonus('mood') * 0;
  const nanny = G.servants.nanny || 0;
  for (const p of livingMembers()) {
    const a = ageOf(p), cap = capOf(p);
    if (a <= 20) {   // 成長
      const g = { int:randi(0, 2), eq:randi(0, 2), str:randi(0, 2) };
      const tl = talentOf(p); if (tl) for (const k in tl.grow) g[k] = (g[k] || 0) + tl.grow[k];
      const ed = EDUCATIONS.find(x => x.id === p.edu) || EMP_TUTORS.find(x => x.id === p.edu);   // 皇子女由太傅教導   // 啟蒙所學，6–18 歲每年額外成長
      if (ed && a >= QIMENG_AGE && a <= 18) for (const k in ed.grow) g[k] = (g[k] || 0) + ed.grow[k];
      if (a < 16) for (const k in g) g[k] += Math.floor(nanny / 2);
      for (const k in g) if (k !== 'hp' && k !== 'mood') p.stats[k] = clamp(p.stats[k] + g[k], 0, Math.max(cap, p.stats[k]));
      if (tl && tl.grow.hp) p.stats.hp = Math.min(100, p.stats.hp + tl.grow.hp);
    } else if (p.job) {
      const k = jobLine(p).stats[0];
      if (Math.random() < 0.5) p.stats[k] = clamp(p.stats[k] + 1, 0, Math.max(cap, p.stats[k]));
    }
    // 健康：40 歲後衰退加快
    if (a < 40) p.stats.hp = Math.min(100, p.stats.hp + (p.stats.hp < 85 ? 3 : 1));
    else p.stats.hp = Math.max(0, Math.round((p.stats.hp - (1 + (a - 40) * 0.12) + collBonus('hp') * 0.3) * 10) / 10);
    // 心情：回歸平常心 + 住宅加成
    p.stats.mood = clamp(Math.round(p.stats.mood + (55 - p.stats.mood) * 0.15 + hm), 0, 100);
    // 里程碑：6 歲啟蒙、16 歲立業（都由玩家自己決定）
    if (isEmp()) {   // 帝王模式：6 歲請太傅、18 歲由皇帝指婚
      if (a === QIMENG_AGE && !p.edu && p.blood) enqueue({ type:'etutor', pid:p.id });
      if (a === 18 && p.blood && !isMarried(p) && p.id !== G.headId) G.emp.sched.push({ at:monthIndex() + randi(1, 6), type:'zhihun', pid:p.id });
      G.stats.maxAge = Math.max(G.stats.maxAge, a); continue;
    }
    if (a === QIMENG_AGE && !p.edu) enqueue({ type:'qimeng', pid:p.id });
    if (a === JOB_MIN_AGE && !p.job && !p.liye) enqueue({ type:'liye', pid:p.id });
    if (a === 18 && p.blood && !p.founder && !isMarried(p)) G.scheduled.push({ at:monthIndex() + randi(ADULT_MATCH_MONTHS[0], ADULT_MATCH_MONTHS[1]), type:'event', id:'y_match', pid:p.id });
    G.stats.maxAge = Math.max(G.stats.maxAge, a);
  }
  // 官職帶來的年度名聲
  for (const p of livingMembers()) if (p.job === 'official') G.fame += 2 + p.rank * 2;
  // 官員考核（每 3 年）
  if ((G.year - START_YEAR) % 3 === 1) assessAll();
  if (G.year % EXAM_CYCLE === 0 && !isEmp()) centerTip('今年是科舉年！符合資格的族人可報名應考');
  if (isEmp()) empYear();
  checkDeaths();
}
function assessAll() {
  const lines = [];
  for (const p of livingMembers().filter(x => x.job === 'official')) {
    const e = eff(p, 'eq');
    if (e < IMPEACH_EQ && Math.random() < 0.5) {
      if (e < CONFISCATE_EQ) { enqueue({ type:'confiscate', pid:p.id }); lines.push(`${p.name}遭御史彈劾，罪證確鑿！`); continue; }
      fireOfficial(p); lines.push(`${p.name}不會做人，遭同僚彈劾罷官。`); continue;
    }
    const sc = (eff(p, 'int') + e) / 2 + p.prof * ASSESS_PROF_W + rand(-12, 12);
    const need = Math.min(ASSESS_CAP, ASSESS_PROMOTE + p.rank * ASSESS_STEP) + (p.rank >= TAIFU_RANK ? ASSESS_PREMIER_EXTRA : p.rank >= 12 ? ASSESS_TOP_EXTRA : 0);
    // 考績特優：越級擢升兩階
    if (p.prof >= ASSESS_MIN_PROF && sc >= need + ASSESS_LEAP && p.rank + 2 <= 12) { changeOfficialRank(p, 2); lines.push(`${p.name}考核「特優」，越級擢升為${offName(p.rank)}！`); p.prof = 0; continue; }
    const L = JOB_LINES.official;
    if (p.prof >= ASSESS_MIN_PROF && sc >= need && p.rank < L.ranks.length - 1) { changeOfficialRank(p, 1); lines.push(`${p.name}考核「卓異」，升任${offName(p.rank)}！`); }
    else if (sc <= ASSESS_DEMOTE) { changeOfficialRank(p, -1); lines.push(p.job === 'official' ? `${p.name}考核「不稱職」，貶為${offName(p.rank)}。` : `${p.name}考核不及格，罷官。`); }
    else lines.push(`${p.name}考核「稱職」，留任${offName(p.rank)}。`);
  }
  if (lines.length) enqueue({ type:'info', title:'三年考核', lines });
}
function confiscate(p) {
  const pi = G.heirlooms.indexOf('goldtab');
  if (pi >= 0) { G.heirlooms.splice(pi, 1); if (G.equipped === 'goldtab') G.equipped = null; fireOfficial(p); return { pardoned:true, lost:0, shops:[] }; }
  const lost = Math.max(0, G.silver * 0.6); G.silver -= lost;
  const own = ownedShops(), taken = [];
  for (let i = 0; i < Math.ceil(own.length / 3); i++) { const id = own.splice(randi(0, own.length - 1), 1)[0]; if (id) { delete G.buildings[id]; taken.push(BUILDINGS.find(b => b.id === id).name); } }
  G.fame = Math.floor(G.fame * 0.6);
  fireOfficial(p);
  flog(`${p.name}獲罪，${G.surname}家被抄家！`);
  return { pardoned:false, lost, shops:taken };
}

/* ---------- 科舉 ---------- */
const isExamYear = (y = G.year) => y % EXAM_CYCLE === 0;
function examCandidates(i) {
  return livingMembers().filter(p => !p.trading && p.job !== 'official' && p.degree === i && ageOf(p) >= EXAMS[i].minAge && eff(p, 'int') >= EXAM_MIN_INT && isStudyRoute(p));
}
// 讀書路線：書生、書院任職，或還沒工作但上過私塾的孩子／青年
const isStudyRoute = p => p.job === 'student' || p.job === 'academy' || (!p.job && p.edu === 'school');
// 啟蒙：付學費、記錄所學
function applyEducation(p, ed) {
  const c = scaled(ed.cost);
  G.silver -= c;
  if (ed.silver) G.silver += scaled(ed.silver);
  p.edu = ed.id;
  plog(p, `${G.year}年 六歲啟蒙：${ed.name}`);
}
// 中途改走讀書路線：孩子補上私塾、成年人轉為書生
function switchToStudy(p) {
  if (ageOf(p) >= JOB_MIN_AGE) { setJob(p, 'student'); return; }
  const ed = EDUCATIONS.find(x => x.id === 'school');
  G.silver -= scaled(ed.cost); p.edu = 'school';
  plog(p, `${G.year}年 改上私塾讀書`);
}
function examChance(p, i, opt) {
  let c = EXAMS[i].base + (eff(p, 'int') - 50) + (eff(p, 'mood') - 50) * 0.3 + (eff(p, opt.stat) - 50) * 0.2 + opt.bonus + collBonus('exam');
  if (p.founder) c += opt.modern || 0;
  return Math.round(clamp(c, 5, 95));
}
function takeExam(p, i, opt) {
  const ex = EXAMS[i];
  if (i === 3) {
    const sc = eff(p, 'int') + eff(p, 'mood') * 0.3 + opt.bonus + (p.founder ? opt.modern || 0 : 0) + collBonus('exam') + rand(0, 40);
    const r = DIANSHI_RANKS.find(x => sc >= x.min);
    p.degree = 4; p.title = r.title;
    G.stats.jinshi++; if (r.title === '狀元') G.stats.zhuangyuan++;
    p.job = 'official'; p.rank = r.rank; p.prof = 0;
    G.stats.maxOfficial = Math.max(G.stats.maxOfficial, p.rank);
    const fg = r.title === '狀元' ? 80 : r.rank === 1 ? 50 : 30;
    G.fame += fg;
    plog(p, `${G.year}年 殿試高中${r.title}，授官${offName(r.rank)}`);
    flog(`${p.name}殿試高中${r.title}！`);
    return { pass:true, title:r.title, rankName:offName(r.rank), fame:fg };
  }
  const ch = examChance(p, i, opt);
  const pass = Math.random() * 100 < ch;
  if (pass) {
    p.degree = i + 1; p.title = ex.degree;
    const fg = [5, 15, 25][i]; G.fame += fg;
    plog(p, `${G.year}年 ${ex.name}中榜，成為${ex.degree}`);
    return { pass, title:ex.degree, fame:fg, chance:ch };
  }
  plog(p, `${G.year}年 ${ex.name}落榜`);
  p.stats.mood = Math.max(0, p.stats.mood - 8);
  return { pass:false, chance:ch };
}

// 候補授官（舉人、貢士不必考殿試也能當小官）與捐官
function canHoubu(p) { return p.alive && p.job !== 'official' && HOUBU_RANK[p.degree] !== undefined && ageOf(p) >= JOB_MIN_AGE; }
function enterOffice(p, rank, how) {
  p.job = 'official'; p.rank = rank; p.prof = 0;

}
const juanguanCost = () => scaled(JUANGUAN_COST);

/* ---------- 相親 ---------- */
function matchCandidates(p) {
  const t = clamp(Math.floor(eff(p, 'eq') / 22 + G.fame / 400), 0, 4);
  const tiers = [Math.max(0, t - 2), Math.max(0, t - 1), t];
  const g = p.gender === 'm' ? 'f' : 'm';
  return tiers.map(tier => {
    const T = MATCH_TIERS[tier];
    const stats = randStats(T.stat, 10); stats.hp = randi(70, 95); stats.mood = randi(50, 75);
    const chance = 88 - tier * 12 + (eff(p, 'eq') - 50) * 0.6 + G.fame / 30 - (tier === t ? 6 : 0);
    return { tier, name:randomFullName(g, G.surname), gender:g, age:Math.max(16, ageOf(p) + randi(-4, 3)), stats,
      apt:clamp(tier - 1 + randi(0, 2), 0, 3), dowry:scaled(T.dowry), wedding:scaled(T.wedding), chance:Math.round(clamp(chance, 5, 95)), rejected:false };
  });
}
function tryMarry(p, c) {
  if (G.silver < c.wedding) return { ok:false, msg:'婚宴銀兩不足' };
  G.silver -= c.wedding;
  if (Math.random() * 100 >= c.chance) { c.rejected = true; return { ok:false, msg:`${c.name}的家人婉拒了這門親事……（花費的 ${fmt(c.wedding)} 兩打了水漂）` }; }
  G.silver += c.dowry;
  return { ok:true, s:wedSpouse(p, c), dowry:c.dowry };
}
// 配偶加入家族（相親成功或事件成親共用）
function wedSpouse(p, c) {
  const s = makePerson({ name:c.name, gender:c.gender, by:G.year - c.age, stats:c.stats, apt:c.apt, blood:false, gen:p.gen });
  s.tag = MATCH_TIERS[c.tier].name + '出身';
  p.spouseId = s.id; s.spouseId = p.id;
  plog(p, `${G.year}年 與${s.name}成親`); plog(s, `${G.year}年 嫁娶入${G.surname}家，配偶${p.name}`);
  flog(`${p.name}與${MATCH_TIERS[c.tier].name}出身的${s.name}成親`);
  G.justBorn = s.id; G.treeDirty = true;
  return s;
}
// 事件直接成親：產生指定家世的對象
function eventMarry(p, tier) {
  if (isMarried(p)) return null;
  const c = matchCandidates(p)[2];
  const T = MATCH_TIERS[tier];
  c.tier = tier; c.stats = randStats(T.stat, 10); c.stats.hp = randi(70, 95); c.stats.mood = randi(55, 75); c.apt = clamp(tier - 1 + randi(0, 2), 0, 3);
  return wedSpouse(p, c);
}

/* ---------- 跑商 ---------- */
const tradeEligible = () => livingMembers().filter(p => ageOf(p) >= 16 && !p.trading && p.job !== 'official');
const tradeScale = () => Math.max(15, G.lastGross);
function tradeLegGain(leg, ids) {
  let m = 0.5; for (const id of ids) m += eff(P(id), 'eq') / 120 * (P(id).job === 'merchant' ? 1 + MERCHANT_TRADE : 1);
  return leg.base * tradeScale() * m * (1 + 0.08 * ids.length) * (1 + collBonus('trade'));
}
function tradeRemainMonths(t) { let r = t.legRemain; for (let i = t.leg + 1; i < TRADE_LEGS.length; i++) r += TRADE_LEGS[i].months; return t.leg >= TRADE_LEGS.length ? 0 : r; }
function startTrade(ids) {
  if (!ids.length) return { ok:false, msg:'請至少選 1 位族人同行' };
  for (const id of ids) { const p = P(id); p.trading = true; for (const b in G.buildings) if (G.buildings[b].manager === id) G.buildings[b].manager = null; }
  G.trade = { members:ids.slice(), leg:0, legRemain:TRADE_LEGS[0].months, earned:0, log:[] };
  flog(`${ids.map(i => P(i).name).join('、')}從長安出發跑商`);
  return { ok:true };
}
function tradeArrive() {
  const t = G.trade, leg = TRADE_LEGS[t.leg];
  const enc = wpick(TRADE_ENCOUNTERS, x => x.w);
  let mul = enc.mul; if (enc.guard) mul = 1 - (1 - mul) * (1 - guardReduce());
  const gain = t.members.length ? tradeLegGain(leg, t.members) * mul : 0;
  t.earned += gain;
  if (enc.tokens) G.tokens += enc.tokens;
  if (enc.fame) G.fame += enc.fame;
  t.log.push(`抵達${leg.to}：${enc.text}（+${fmt(gain)}）`);
  hint(`🐎 商隊抵達${leg.to}，${enc.text}`);
  t.leg++;
  if (t.leg >= TRADE_LEGS.length) finishTrade();
  else t.legRemain = TRADE_LEGS[t.leg].months;
}
function finishTrade() {
  const t = G.trade;
  G.silver += t.earned; G.totalEarned += t.earned;
  for (const id of t.members) { const p = P(id); p.trading = false; if (p.alive) { p.stats.eq = Math.min(capOf(p), p.stats.eq + 2); plog(p, `${G.year}年 跑商歸來，走遍五城`); } }
  enqueue({ type:'info', title:'跑商歸來', lines:[...t.log, `總共獲得銀兩 ${fmt(t.earned)} 兩！`] });
  G.trade = null; LIVE = null;
}
function quickTradeCost() { return G.trade ? Math.max(1, Math.ceil(tradeRemainMonths(G.trade) / 6)) : 0; }
function quickTrade() { const c = quickTradeCost(); if (G.tokens < c) return false; G.tokens -= c; while (G.trade) tradeArrive(); return true; }

/* ---------- 許願樹 ---------- */
const wishFree = () => G.wishDay !== todayStr();
function makeWish(p) {
  if (wishFree()) G.wishDay = todayStr();
  else { if (G.tokens < 1) return null; G.tokens--; }
  const r = wpick(WISH_RESULTS, x => x.w);
  const out = [];
  p.delta = {};
  let text = r.text;
  if (r.kind === 'stat') { const k = pick(['int', 'eq', 'str']); text = text.replace('{stat}', STAT_NAME[k]); applyFx({ [k]:randi(8, 15) }, p, out); }
  else if (r.kind === 'hp') applyFx({ hp:100 }, p, out);
  else if (r.kind === 'prof') { if (p.job && p.job !== 'student' && !isTop(p)) applyFx({ prof:randi(30, 50) }, p, out); else applyFx({ int:5, eq:5 }, p, out); }
  else if (r.kind === 'silver') applyFx({ silver:randi(150, 500) }, p, out);
  else if (r.kind === 'mood') applyFx({ mood:30 }, p, out);
  else if (r.kind === 'gold') applyFx({ gold:1 }, p, out);
  save();
  return { text:tpl(text, p), out };
}

/* ---------- 藏品寶箱（保底機制）---------- */
function gachaGive(q) { const c = pick(COLLECTIBLES.filter(x => x.q === q)); G.collection[c.id] = Math.min(COLLECT_MAX_LV, (G.collection[c.id] || 0) + 1); return { c, lv:G.collection[c.id] }; }
function gachaPull() {
  if (G.gold < 1) return null;
  G.gold--; G.gacha.total++;
  const g = G.gacha;
  let q;
  if (g.sinceShen + 1 >= GACHA_PITY_SHEN) q = '神品';

/* ---------- 每月 ---------- */
function monthTick() {
  G.month++;
  if (G.month > 12) { G.month = 1; G.year++; yearTick(); }
  if (G.over) return;
  if (isEmp()) { empMonth(); return; }   // 帝王模式：改走朝政流程（4b 區塊）
  const e = calcEconomy();
  G.lastGross = e.gross; G.lastNet = e.net;
  G.silver += e.net; if (e.net > 0) G.totalEarned += e.net;
  moneyFloat(e.net);
  // 熟練度
  for (const p of livingMembers()) {
    if (!p.job || p.job === 'student' || p.trading || isTop(p)) continue;
    p.prof = Math.min(100, p.prof + (PROF_BASE + lineStatAvg(p) * PROF_STAT) / 12 * (1 + collBonus('prof')) * (p.job === 'official' ? OFFICIAL_PROF_MUL : 1));
    checkPromote(p);
  }
  for (const id in G.buildings) if (G.buildings[id].closed > 0) G.buildings[id].closed--;
  G.boosts = G.boosts.filter(b => --b.months > 0);
  if (G.trade && --G.trade.legRemain <= 0) tradeArrive();
  births();
  // 科舉
  if (isExamYear()) EXAMS.forEach((ex, i) => { if (ex.month === G.month) for (const p of examCandidates(i)) enqueue({ type:'exam', pid:p.id, i }); });
  // 排程事件（書生報恩、預言中的天災…）
  const now = monthIndex();
  for (const s of G.scheduled.filter(x => x.at <= now)) {
    if (s.type === 'repay') enqueue({ type:'info', title:'書生報恩', lines:[`當年資助的書生${s.name}高中進士，特地登門報恩！`, `送上謝禮 ${fmt(scaled(1500))} 兩，家族名聲 +20`], fx:{ silver:1500, fame:20 } });
    if (s.type === 'event' && head()) enqueue({ type:'event', id:s.id, pid:s.pid || G.headId, foreseen:true });
  }
  G.scheduled = G.scheduled.filter(x => x.at > now);
  // 隨機事件：每 2–4 個月
  if (--G.evTimer <= 0) { const r = pickEvent(); if (r) enqueue({ type:'event', id:r.e.id, pid:r.p.id }); G.evTimer = randi(2, 4); }
  npcTick();
  checkDeaths();
  checkAchievements();
}

  const mp = m.pid && P(m.pid);

/* ---------- 每月 ---------- */

  }

  if (E.nat.minxin <= 5 && !E.crises.famine) E.crises.famine = { stage:2, at:now };

}
function empBirths() {
  const emp = head(), now = monthIndex();
  const bearOK = (a, b) => { const mo = a.gender === 'f' ? a : b; const wa = ageOf(mo); if (wa < 16 || wa > 45) return 0; if (mo.lastBear && now - mo.lastBear < 12) return 0; return wa <= 30 ? 1 : (46 - wa) / 16; };

    const f = bearOK(emp, c); if (!f) continue;
    const ch = EMP_BIRTH_RATE * (c.consort.favor / 50) * f * (ageOf(emp) > 65 ? EMP_OLD_BIRTH : 1);
    if (Math.random() < ch) {
      const kid = bear(emp, c, true); (emp.gender === 'f' ? emp : c).lastBear = now;
      G.emp.lastBirth = { at:now, motherId:c.id, kid:kid.id };
      c.consort.favor = clamp(c.consort.favor + 5, 0, 100);
      empLog(`${rankName(c.consort.rank)}${c.name}誕下${kid.gender === 'm' ? '皇子' : '公主'}${kid.name}`);
      if (Math.random() < 0.35) queueEmpEvent(EMP_EVENTS.find(x => x.id === 'ev_birth'), { kind:'person', ref:c.id });
      else hint(`👶 ${c.name}誕下${kid.gender === 'm' ? '皇子' : '公主'}「${kid.name}」`);

    const s = spouseOf(p); if (!s || !s.alive || s.out) continue;
    const f = bearOK(p, s); if (!f || Math.random() > 0.02 * f) continue;
    const kid = bear(p, s, true); (p.gender === 'f' ? p : s).lastBear = now;
    const qi = Q.findIndex(x => x.type === 'zhuazhou' && x.pid === kid.id); if (qi >= 0) Q.splice(qi, 1);

  }
}

/* ---------- 每年 ---------- */
function empYear() {

  const royal = consorts().length + empKids().length;
  const army = EMP_ARMY_COST * n.bingli * (1 + E.mods.armyCost);
  const court = EMP_COURT_BASE * (1 + 0.08 * royal);

    if (b.power > 50) b.loyalty = clamp(b.loyalty - 1, 0, 100);

  }

  if (E.mods.pirates && Math.random() < 0.2) hint('🏴‍☠ 沿海倭寇騷擾，外患上升');

}
